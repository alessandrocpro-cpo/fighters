<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2f63">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>Climbrawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Concept : app mobile lumineuse façon jeu d'action mignon. Cartes blanches à contour épais violet-encre, ombre franche, accents jaune/ciel. */
:root {
  --sky: #a9ddff; --grass: #9ed98a; --card: #ffffff; --card-2: #f3eeff; --ink: #2a1f3d; --chrome: #3a2f63; --chrome-2: #2d2450;
  --gold: #ffc93d; --gold-d: #f09a0e; --blood: #ff5d6c; --soul: #4ac4ff; --life: #ffd84a; --heal: #5fd38a;
  --text: #ffffff; --muted: #c9c2e6; --muted-ink: #6b5f86;
  --f-display: "Lilita One", "Arial Black", Impact, sans-serif;
  --f-souls: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; touch-action: manipulation; background: linear-gradient(180deg, var(--sky) 0%, #d8f1ff 45%, var(--grass) 100%); color: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: 15px; overflow: hidden; user-select: none; -webkit-user-select: none; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background: radial-gradient(60px 22px at 12% 18%, #fff 60%, transparent 62%), radial-gradient(80px 26px at 82% 10%, #fff 60%, transparent 62%), radial-gradient(160px 40px at 30% 96%, #b9e6a2 60%, transparent 62%), radial-gradient(200px 50px at 85% 92%, #b9e6a2 60%, transparent 62%); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--soul); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 520px) { #app { border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); box-shadow: 0 0 0 6px rgba(42,31,61,.08); } }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; letter-spacing: .3px; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Composants ---------- */
.panel { background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: 0 4px 0 var(--ink); padding: 12px; position: relative; }
.panel.dark { background: var(--chrome); color: var(--text); }
.panel.flat { background: var(--card-2); box-shadow: none; border-width: 2px; }
.label { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted-ink); font-weight: 800; }
.panel.dark .label { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-display); font-size: 18px; letter-spacing: .4px; padding: 12px 16px; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-gold { background: linear-gradient(var(--gold) 55%, #ffb21f 55%); color: var(--ink); }
.btn-stone { background: linear-gradient(#ffffff 55%, #ece6fb 55%); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--muted-ink); border-color: transparent; box-shadow: none; font-size: 15px; padding: 6px; }
.btn-soul { background: linear-gradient(#7fd6ff 55%, #4ac4ff 55%); color: var(--ink); }
.btn-blood { background: linear-gradient(#ff7a85 55%, var(--blood) 55%); color: #fff; text-shadow: 0 1px 0 var(--ink); }
.btn-big { width: 100%; font-size: 22px; padding: 15px; }
.btn-sm { font-size: 14px; padding: 7px 11px; box-shadow: 0 3px 0 var(--ink); border-width: 2.5px; }
.btn-sm:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn .delta { font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink); font-size: 12px; background: var(--card-2); color: var(--ink); }
.chip.hot { background: var(--gold); font-family: var(--f-display); font-size: 14px; }
.soulc { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-display); font-size: 17px; color: inherit; }
.ico { display: inline-block; vertical-align: middle; flex: none; }
.bar { position: relative; height: 16px; border: 2.5px solid var(--ink); border-radius: 9px; background: #5a3a63; overflow: hidden; }
.bar > .trail, .bar > .fill { position: absolute; inset: 0 auto 0 0; transition: width .25s ease-out; }
.bar > .trail { background: #ff8a5c; transition: width .7s .25s ease-out; }
.bar > .fill { background: linear-gradient(#ffe066 50%, #ffc21f 50%); }
.bar > .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; text-shadow: 0 0 2px var(--ink), 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); font-family: var(--f-display); letter-spacing: .5px; }
.xpbar { height: 7px; border-radius: 4px; background: rgba(42,31,61,.25); border: 1.5px solid var(--ink); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd84a, #ffb21f); }
.minis { display: flex; gap: 3px; margin-top: 3px; }
.mini { flex: 1; height: 6px; border: 1.5px solid var(--ink); border-radius: 3px; background: #5a3a63; overflow: hidden; }
.mini i { display: block; height: 100%; background: #8fe38f; transition: width .25s; }

/* ---------- Barre haute / nav (chrome violet) ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); background: var(--chrome); color: var(--text); border-bottom: 3px solid var(--ink); }
.top .avatar { width: 48px; height: 48px; border-radius: 12px; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 35%, #cfe9ff, #8fc8f2); flex: none; }
.top .name { font-family: var(--f-display); font-size: 19px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chrome); border-top: 3px solid var(--ink); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: 12px; letter-spacing: .5px; position: relative; border-radius: 12px; }
.nav button.on { color: var(--gold); background: rgba(255,255,255,.08); }
.nav .badge { position: absolute; top: 2px; right: calc(50% - 24px); min-width: 19px; height: 19px; border-radius: 10px; background: var(--blood); color: #fff; font-size: 11px; display: grid; place-items: center; border: 2px solid var(--ink); padding: 0 4px; }

/* ---------- Tour ---------- */
.tier { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tier h2 { font-size: 24px; color: #fff; -webkit-text-stroke: 1.2px var(--ink); text-shadow: 0 3px 0 var(--ink); }
.prog { height: 10px; border-radius: 5px; background: rgba(255,255,255,.6); border: 2px solid var(--ink); overflow: hidden; }
.prog > i { display: block; height: 100%; background: linear-gradient(90deg, #ffb21f, var(--gold)); }
.strip { display: flex; flex-direction: column; gap: 4px; }
.floor { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 11px; background: rgba(255,255,255,.7); border: 2px solid var(--ink); color: var(--muted-ink); font-size: 13px; }
.floor .n { font-family: var(--f-display); font-size: 17px; color: var(--ink); text-align: center; }
.floor.done { opacity: .55; }
.floor.cur { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.floor .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.portals { display: flex; flex-wrap: wrap; gap: 6px; }
.foe { display: grid; grid-template-columns: 112px 1fr; gap: 12px; }
.foe canvas { width: 112px; height: 140px; border-radius: 12px; border: 2.5px solid var(--ink); background: linear-gradient(#bfe6ff 60%, #9ed98a 60%); }
.foe h3 { font-size: 21px; line-height: 1.05; }
.foe .title { font-size: 13px; color: var(--muted-ink); margin-top: 2px; }
.excl { margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; background: #fff3c4; border: 2px solid var(--ink); font-size: 13px; color: #6b4a00; }
.odds { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.odds .meter { flex: 1; height: 11px; border-radius: 6px; border: 2px solid var(--ink); background: var(--card-2); overflow: hidden; }
.odds .meter i { display: block; height: 100%; }
.odds b { font-family: var(--f-display); font-weight: 400; font-size: 16px; min-width: 44px; text-align: right; }
.flasks { display: flex; gap: 4px; }
.tip { display: flex; gap: 10px; align-items: flex-start; background: #e9f7ff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4; color: var(--ink); }
.tip.warm { background: #fff1d6; }
.tip button { margin-left: auto; font-size: 20px; line-height: 1; padding: 0 2px; color: var(--muted-ink); }
.summary .x { font-size: 22px; line-height: 1; color: var(--muted-ink); padding: 0 4px; }
.sumgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sumgrid div { background: var(--card-2); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 4px; text-align: center; }
.sumgrid span { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted-ink); }
.sumgrid b { font-family: var(--f-display); font-weight: 400; font-size: 15px; }

/* ---------- Héros ---------- */
.hero-card { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; }
.hero-card canvas { width: 130px; height: 180px; border-radius: 12px; border: 2.5px solid var(--ink); background: linear-gradient(#bfe6ff 62%, #9ed98a 62%); }
.power { font-family: var(--f-display); font-size: 28px; line-height: 1; }
.power small { font-size: 15px; }
.alloc { display: flex; flex-direction: column; gap: 6px; }
.arow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--card-2); border: 2px solid var(--ink); }
.arow b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.arow small { display: block; font-size: 11px; color: var(--muted-ink); font-weight: 700; }
.arow .val { min-width: 64px; text-align: center; font-family: var(--f-display); font-size: 20px; }
.arow .val small { display: inline; font-size: 12px; color: #2f6fd6; }
.arow .val em { font-style: normal; font-size: 13px; color: #16703a; }
.pm { width: 38px; height: 38px; border-radius: 11px; border: 2.5px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; }
.pm.plus { background: var(--gold); }
.pm:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.pm:disabled { opacity: .35; }
.derived { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 14px; }
.derived div { display: flex; justify-content: space-between; border-bottom: 2px dashed rgba(42,31,61,.15); padding: 4px 0; }
.derived span { color: var(--muted-ink); }
.skills { display: flex; flex-direction: column; gap: 6px; }
.skill { padding: 8px 10px; border-radius: 10px; background: var(--card-2); border: 2px solid var(--ink); font-size: 13px; line-height: 1.35; }
.skill b { font-family: var(--f-display); font-weight: 400; font-size: 16px; display: block; }
.choice { background: #fff8de; }

/* ---------- Sac ---------- */
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slots.three { grid-template-columns: repeat(3, 1fr); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 2.5px solid var(--ink); display: grid; place-items: center; box-shadow: 0 3px 0 var(--ink); background: var(--rbg, #ece9f2); color: var(--ink); overflow: hidden; }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.tile .lv { position: absolute; bottom: 2px; right: 5px; font-family: var(--f-display); font-size: 12px; }
.tile .up { position: absolute; top: 2px; left: 4px; color: #16a34a; font-size: 14px; font-family: var(--f-display); }
.tile .new { position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--blood); border: 2px solid var(--ink); }
.tile.empty { background: rgba(255,255,255,.5); border-style: dashed; box-shadow: none; }
.tile.locked { background: rgba(42,31,61,.08); }
.petslot canvas, .petcv { width: 100%; height: 100%; }
.slotlab { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted-ink); text-align: center; margin-top: 4px; font-weight: 800; }

/* ---------- Combat ---------- */
.fight { position: absolute; inset: 0; z-index: 20; background: var(--chrome-2); display: flex; flex-direction: column; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 8px; background: var(--chrome); color: var(--text); border-bottom: 3px solid var(--ink); }
.hud .side { display: grid; grid-template-columns: 42px 1fr; gap: 6px; align-items: start; min-width: 0; }
.hud .side.r { grid-template-columns: 1fr 42px; text-align: right; }
.hud .side.r .pc { order: 2; }
.hud .pc { width: 42px; height: 42px; border-radius: 10px; border: 2.5px solid var(--ink); background: radial-gradient(circle at 50% 35%, #cfe9ff, #8fc8f2); }
.hud .nm { font-family: var(--f-display); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.hud .side.r .bar > .fill, .hud .side.r .bar > .trail { left: auto; right: 0; }
.hud .side.r .minis { flex-direction: row-reverse; }
.hud .fl { font-family: var(--f-display); font-size: 13px; color: var(--gold); text-align: center; line-height: 1; padding-top: 4px; }
.hud .fl b { display: block; font-weight: 400; font-size: 22px; }
.arena { flex: 1 1 0; min-height: 0; width: 100%; display: block; touch-action: none; }
.flog { flex: 1 1 0; min-height: 70px; padding: 8px 14px; border-top: 3px solid var(--ink); background: var(--chrome); display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 13px; color: var(--muted); overflow: hidden; }
.flog div { opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flog div:last-child { opacity: 1; }
.flog .L { color: #ffe9a3; } .flog .R { color: #ffc0c6; }
.fctl { display: flex; gap: 8px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--chrome); }

/* ---------- Overlays ---------- */
.ov { position: absolute; inset: 0; z-index: 40; background: rgba(42,31,61,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.ov.center { align-items: center; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--card); color: var(--ink); border-top: 3px solid var(--ink); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .28s cubic-bezier(.2,.9,.3,1.2); }
.ov.center .sheet { width: calc(100% - 28px); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); }
.sheet h2 { font-size: 28px; text-align: center; }
.sheet h2.win { color: var(--gold); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 0 3px 0 var(--ink); font-size: 34px; }
.loot { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--card-2); animation: pop .45s backwards; }
.loot.legend { background: #fff1c2; box-shadow: 0 0 0 4px rgba(255,184,31,.35); }
.loot .tile { box-shadow: none; }
.loot b { font-family: var(--f-display); font-weight: 400; font-size: 17px; display: block; line-height: 1.1; }
.loot small { font-size: 12px; color: var(--muted-ink); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cards.two { grid-template-columns: 1fr 1fr; }
.card { color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 14px; border: 2.5px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); text-align: center; min-height: 150px; animation: pop .4s backwards; }
.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.card .k { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted-ink); }
.card b { font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.05; }
.card p { margin: 0; font-size: 12px; line-height: 1.35; color: var(--muted-ink); }
.card.skill { background: #e9f7ff; } .card.pet { background: #fff3d6; }
.cardpet { width: 90px; height: 64px; }
.petbig { width: 96px; height: 76px; border-radius: 12px; border: 2.5px solid var(--ink); background: linear-gradient(#bfe6ff 62%, #9ed98a 62%); flex: none; }
.affix { font-size: 14px; padding: 3px 0; display: flex; justify-content: space-between; }
.delta-up { color: #16a34a; } .delta-down { color: var(--blood); }
.savecode { width: 100%; font-size: 11px; border-radius: 10px; border: 2.5px solid var(--ink); padding: 8px; background: var(--card-2); color: var(--ink); }

/* Mort : registre souls */
.souls-screen { position: absolute; inset: 0; z-index: 45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.souls-screen h1 { font-family: var(--f-souls); font-weight: 700; letter-spacing: 6px; text-transform: uppercase; }
.dead { background: #120d1f; animation: fade 1.2s; }
.dead h1 { font-size: 34px; color: #ff5d6c; animation: died 2.4s ease-out both; }
.dead p { color: #c9c2e6; max-width: 30ch; line-height: 1.5; font-weight: 600; margin: 0; animation: fade 2s 1s backwards; }
.dead p.keep { color: #ffd84a; }
.dead .btn { animation: fade 1s 1.8s backwards; }

/* Création */
.create-prev { height: 220px; width: 100%; border-radius: 16px; border: 3px solid var(--ink); background: linear-gradient(#bfe6ff 65%, #9ed98a 65%); box-shadow: 0 4px 0 var(--ink); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.sw.on { outline: 3px solid #fff; box-shadow: 0 0 0 6px var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.pill.on { background: var(--gold); }
.origins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.origin { text-align: left; padding: 10px; border-radius: 13px; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.origin.on { background: var(--gold); }
.origin b { font-family: var(--f-display); font-weight: 400; font-size: 18px; display: block; }
.origin span { font-size: 12px; line-height: 1.3; display: block; color: var(--muted-ink); }
.origin.on span { color: var(--ink); }
.origin i { font-style: normal; font-size: 11px; display: block; margin-top: 4px; letter-spacing: .3px; }
.namein { width: 100%; font: inherit; font-family: var(--f-display); font-size: 20px; padding: 10px 12px; border-radius: 12px; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); }
.logo { text-align: center; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
.logo h1 { font-size: 46px; color: var(--gold); letter-spacing: 1px; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink); }
.logo p { margin: 4px 0 0; color: var(--ink); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

.toast { position: absolute; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; background: var(--chrome); color: #fff; border: 2.5px solid var(--ink); padding: 8px 14px; border-radius: 12px; font-size: 14px; animation: toast 2.2s forwards; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { transform: scale(.7) rotate(-3deg); opacity: 0; } }
@keyframes died { 0% { opacity: 0; transform: scale(1.15); letter-spacing: 2px; } 40% { opacity: 1; } 100% { transform: scale(1); letter-spacing: 6px; } }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

.stake { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.1); border: 2px dashed rgba(255,255,255,.35); font-size: 13px; }
.stake .risk { color: #ffb3ba; font-size: 12px; }
.stake.big { background: #fff4f4; border: 2.5px dashed var(--blood); color: var(--ink); }
.stake.big .risk { color: #c42b3a; font-size: 13px; font-weight: 800; }
.decide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.decide .btn { flex-direction: column; padding: 12px 8px; }

.decide small { font-family: var(--f-body); font-size: 12px; font-weight: 800; opacity: .8; margin-top: 3px; }

/* Codex façon MyBrute : débloqué = tuile dorée, verrouillé = estompé */
.codex { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.ctile { aspect-ratio: 1; max-width: 100%; border-radius: 9px; border: 2.5px solid #6b3a1a; background: linear-gradient(#f7d55c, #e8b833); color: #5a2e12; display: grid; place-items: center; box-shadow: 0 3px 0 #6b3a1a; position: relative; }
.ctile.off { background: #efe6cc; border-color: #c9b98f; box-shadow: none; opacity: .45; filter: grayscale(1); }
.ctile.legend { box-shadow: 0 3px 0 #6b3a1a, 0 0 0 3px rgba(255,184,31,.55); }
.ctile:active { transform: translateY(2px); }
.codex-h { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 2px; }

.cmp { border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; font-size: 14px; }
.cmp-h, .cmp-r { display: grid; grid-template-columns: 1fr 64px 64px 22px; gap: 6px; padding: 6px 10px; align-items: center; }

.cmp-r span:nth-child(2) { color: var(--muted-ink); }
.cmp-r.same { opacity: .55; }
.powerline { padding: 8px 10px; border-radius: 12px; background: #fff8de; border: 2px solid var(--ink); font-size: 14px; }
.powerline small { display: block; font-size: 11px; color: var(--muted-ink); margin-top: 2px; }

.sheet > * { flex-shrink: 0; }
.ihead { width: 64px; flex: none; }
.ihead .tile { box-shadow: none; }

.gearbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; flex: none; }

.tech.off .ticon { filter: grayscale(.8); opacity: .6; }
.ticon { width: 48px; height: 48px; border-radius: 12px; background: #fff; border: 2px solid var(--ink); display: grid; place-items: center; }
.tech b { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.tech p { margin: 2px 0; font-size: 12px; line-height: 1.35; }
.tech .next { color: #16703a; }
.tech small { font-size: 11px; color: var(--muted-ink); }
.pips { display: inline-flex; gap: 3px; }

.rage > span.num { font-family: var(--f-display); font-size: 14px; min-width: 26px; text-align: right; }

.techs { display: flex; gap: 8px; padding: 8px 14px; background: var(--chrome); }
.tbtn { flex: 1; min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; border-radius: 13px; border: 2.5px solid var(--ink); background: #4a3f78; color: #fff; box-shadow: 0 4px 0 var(--ink); --p: 0; }
.tbtn::before { content: ""; position: absolute; inset: auto 0 0 0; height: calc(var(--p) * 100%); background: rgba(255,170,80,.35); transition: height .25s; }

/* RNG déterministe (mulberry32) : même seed = même résultat. Indispensable pour
   des étages fixes et, plus tard, une validation serveur / PvP asynchrone. */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const r = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  r.weighted = list => {
    let tot = 0; for (const [, w] of list) tot += w;
    let x = r() * tot;
    for (const [v, w] of list) { if ((x -= w) <= 0) return v; }
    return list[list.length - 1][0];
  };
  r.shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  return r;
}

/* ---- 20-character.js ---- */
/* ===== PERSONNAGE : stats dérivées, puissance, niveaux ===== */
function newHero(name, look, origin) {
  const base = { str: 3, agi: 3, spd: 3, end: 3, hp: 0 };
  for (const k of STAT_KEYS) base[k] += ORIGINS[origin].stats[k];
  return { name, look, origin, base, level: 1, xp: 0, points: 0, choices: 0, skills: [], tp: 0, actives: { devaste: 1 } };
}

/* Entité = { base, level, skills, boss? } + équipement { weapon, armor, tal1, tal2 } */
function computeStats(ent, equip) {
  equip = equip || {};
  const s = { str: ent.base.str, agi: ent.base.agi, spd: ent.base.spd, end: ent.base.end };
  const add = { hp: ent.base.hp || 0, crit: 0, evade: 0, combo: 0, block: 0, lifesteal: 0, thorns: 0, regen: 0, xp: 0 };
  const items = [equip.weapon, equip.armor, equip.tal1, equip.tal2].filter(Boolean);
  for (const it of items) for (const k in it.affixes) {
    if (k in s) s[k] += it.affixes[k]; else add[k] += it.affixes[k];
  }
  const wk = equip.weapon ? equip.weapon.base : 'poings';
  const W = WEAPONS[wk];
  const wDmg = equip.weapon ? equip.weapon.dmg : W.dmg;
  const A = equip.armor ? ARMORS[equip.armor.base] : null;
  const has = id => ent.skills.includes(id);
  const bossMul = ent.boss ? 1.25 : 1;

  const st = {
    ...s,
    weapon: wk,
    maxHp: Math.round((40 + s.end * 9 + (ent.level - 1) * 3 + add.hp) * bossMul),
    dmg: wDmg + s.str * 1.15,
    armor: equip.armor ? equip.armor.armor : 0,
    evade: clamp(.03 + s.agi * .011 + (W.evade || 0) + (A && A.evade || 0) + add.evade + (has('fantome') ? .08 : 0), 0, .55),
    acc: s.agi * .004,
    crit: clamp(.04 + s.agi * .005 + W.crit + add.crit, 0, .7),
    critMult: has('colere') ? 2.2 : 1.6,
    combo: clamp(s.agi * .007 + W.combo + add.combo, 0, .6),
    block: clamp(add.block + (has('peau') ? .12 : 0), 0, .5),
    lifesteal: add.lifesteal + (has('soif') ? .2 : 0),
    thorns: add.thorns,
    regen: add.regen,
    xpBonus: add.xp,
    speed: Math.max(4, 10 + s.spd + W.spd + (A && A.spd || 0)),
    stun: W.stun || 0,
    pierce: W.pierce || 0,
    first: !!W.first,
    skills: ent.skills.slice(),
  };
  st.dmg *= bossMul;
  st.power = computePower(st);
  return st;
}

/* Puissance = moyenne géométrique attaque x défense. Sert de repère, pas de loi. */
function computePower(st) {
  const has = id => st.skills.includes(id);
  let off = st.dmg * (1 + st.crit * (st.critMult - 1)) * (1 + st.combo) * (st.speed / 10) * (1 + st.lifesteal * .5);
  let def = st.maxHp / (1 - st.armor / (st.armor + 50)) / (1 - st.evade) / (1 - st.block) + st.regen * 25;
  if (has('furie')) off *= 1.12;
  if (has('fracas')) off *= 1.22;
  if (has('riposte')) off *= 1.08;
  if (has('premier')) off *= 1.04;
  if (has('souffle')) def *= 1.2;
  if (has('regard')) def *= 1.12;
  def *= 1 + st.thorns * .4;
  return Math.round(Math.sqrt(off * def) * 10);
}

/* ---------- Familiers ---------- */
const petBase = pet => PETS[pet.species];
function petStats(pet) {
  const sp = petBase(pet), R = RARITIES[pet.rarity];
  const sc = (1 + (pet.ilvl - 1) * .11) * R.mult * (pet.bossPet ? 1.2 : 1);
  const st = {
    maxHp: Math.round(sp.hp * sc), dmg: sp.dmg * sc, armor: 0, evade: sp.evade + (pet.bossPet ? .04 : 0), acc: 0,
    crit: sp.crit, critMult: 1.6, combo: 0, block: 0, lifesteal: 0, thorns: 0, regen: 0,
    speed: sp.speed + Math.min(8, pet.ilvl * .05), stun: 0, pierce: 0, first: false, skills: [],
  };
  st.power = computePower(st);
  return st;
}
const petSlots = level => PET_SLOT_LEVELS.filter(l => level >= l).length;
function teamPower(st, pets) { return Math.round(st.power + (pets || []).filter(Boolean).reduce((a, p) => a + petStats(p).power * .7, 0)); }

/* ---------- XP et niveaux ---------- */
const xpToNext = lvl => Math.round(26 * Math.pow(lvl, 1.62) + 20);
const xpReward = floor => Math.round((10 + floor * 5) * (floor % 10 === 0 ? 3 : 1));
const WIN_HEAL = .2; // part des PV max récupérée après chaque victoire
/* Verse l'XP : chaque niveau = POINTS_PER_LEVEL points, tous les CHOICE_EVERY niveaux = un choix façon MyBrute */
function grantXp(hero, amount) {
  hero.xp += amount; let gained = 0;
  while (hero.xp >= xpToNext(hero.level)) {
    hero.xp -= xpToNext(hero.level); hero.level++; gained++;
    hero.points += POINTS_PER_LEVEL;
    if (hero.level % CHOICE_EVERY === 0) hero.choices++;
    if (hero.level % TP_EVERY === 0) hero.tp = (hero.tp || 0) + 1;
  }
  return gained;
}

/* Choix façon MyBrute : 2 bonus, on en garde 1 */
function rollChoice(hero, freePetSlot, r) {
  const opts = [];
  const free = r.shuffle(SKILL_IDS.filter(id => !hero.skills.includes(id)));
  if (free.length) opts.push({ type: 'skill', id: free[0] });
  if (freePetSlot) opts.push({ type: 'pet', species: r.weighted(PET_POOL.slice(0, 6)), rarity: r.chance(.3) ? 1 : 0 });
  if (free.length > 1 && opts.length < 2) opts.push({ type: 'skill', id: free[1] });
  if (opts.length < 2) opts.push({ type: 'hp', v: 15 + hero.level * 3 });
  if (opts.length < 2) opts.push({ type: 'points', v: 2 });
  return r.shuffle(opts).slice(0, 2);
}
function choiceLabel(c) {
  if (c.type === 'skill') return { title: SKILLS[c.id].name, sub: 'Pouvoir', desc: SKILLS[c.id].desc };
  if (c.type === 'pet') return { title: PETS[c.species].name, sub: 'Familier' + (c.rarity ? ' rare' : ''), desc: 'Combat à tes côtés. Les ennemis partagent leurs coups entre vous.' };
  if (c.type === 'hp') return { title: '+' + c.v + ' PV max', sub: 'Vigueur', desc: 'Plus de marge pour grimper loin.' };
  return { title: '+' + c.v + ' points', sub: 'Entraînement', desc: 'Points de stats bonus à répartir.' };
}

/* Techniques actives : 1 point = débloquer (rang 1) ou améliorer (jusqu'au rang 3) */
const activeRank = (hero, id) => (hero.actives && hero.actives[id]) || 0;
function learnActive(hero, id) {
  if (!hero.actives) hero.actives = {};
  if ((hero.tp || 0) < 1 || activeRank(hero, id) >= 3) return false;
  hero.tp--; hero.actives[id] = activeRank(hero, id) + 1; return true;
}
function ensureHeroV3(hero) {
  if (hero.actives == null) hero.actives = {};
  if (hero.tp == null) hero.tp = 1 + Math.floor(hero.level / TP_EVERY);
}

function enemyTraits(en, heroSt) {
  const es = computeStats(en, en.equip), t = [];
  if (es.evade >= .2) t.push('insaisissable');
  if (es.armor / (es.armor + 50) >= .16) t.push('cuirasse');
  if (es.crit >= .16 || es.skills.includes('fracas') || es.skills.includes('colere')) t.push('frappe');
  if (en.pets && en.pets.length) t.push('meute');
  if (es.regen > 0 || es.skills.includes('souffle') || es.lifesteal >= .1) t.push('increvable');
  if (heroSt && es.speed > heroSt.speed * 1.25) t.push('rapide');
  return t;
}
/* Techniques conseillées : les plus utiles contre les traits de l'adversaire, parmi celles apprises */
function recommendLoadout(hero, traits) {
  const learned = ACTIVE_IDS.filter(id => activeRank(hero, id) > 0);
  const score = id => ACTIVES[id].base + activeRank(hero, id) * .3 + (ACTIVES[id].counters.some(c => traits.includes(c)) ? 3 : 0);
  return learned.sort((a, b) => score(b) - score(a)).slice(0, activeSlots(hero.level));
}

/* ---- 30-loot.js ---- */
/* ===== BUTIN : génération d'objets ===== */
function rollRarity(r, floor, boss) {
  const f = Math.min(floor, 100);
  const w = [Math.max(12, 64 - f * .7), 27 + f * .12, 7 + f * .28, 1.2 + f * .1];
  if (boss) { w[0] = 0; w[2] *= 2; w[3] *= 2.5; }
  return r.weighted(w.map((x, i) => [i, x]));
}

function makeItem(r, slot, ilvl, rarity) {
  const R = RARITIES[rarity];
  const scale = 1 + (ilvl - 1) * .11;
  const it = { id: uid(), slot, ilvl, rarity, affixes: {}, isNew: true };
  if (slot === 'weapon') { it.base = r.pick(WEAPON_DROP); it.dmg = round1(WEAPONS[it.base].dmg * scale * R.mult); }
  else if (slot === 'armor') { it.base = r.pick(Object.keys(ARMORS)); it.armor = Math.round(ARMORS[it.base].armor * scale * R.mult); }
  else it.base = r.pick(Object.keys(TALISMANS));
  const n = R.affixes + (slot === 'talisman' ? 1 : 0);
  const pool = r.shuffle(AFFIX_POOL[slot]);
  for (let i = 0; i < n; i++) { const k = pool[i]; it.affixes[k] = AFFIXES[k].roll(ilvl, R.mult, r); }
  it.name = itemName(r, it);
  return it;
}

function itemName(r, it) {
  const baseName = it.slot === 'weapon' ? WEAPONS[it.base].name : it.slot === 'armor' ? 'Armure ' + ARMORS[it.base].name.toLowerCase() : TALISMANS[it.base].name;
  if (it.rarity === 3) return r.pick(LEGEND_NAMES);
  const mat = MATERIALS[Math.min(MATERIALS.length - 1, Math.floor((it.ilvl - 1) / 10))];
  return baseName + ' ' + mat;
}
function itemTypeName(it) {
  if (it.slot === 'pet') return 'Familier · ' + PETS[it.species].name;
  if (it.slot === 'weapon') return WEAPONS[it.base].name;
  if (it.slot === 'armor') return 'Armure ' + ARMORS[it.base].name.toLowerCase();
  return TALISMANS[it.base].name;
}

function makePet(r, ilvl, rarity, species, bossIdx) {
  const p = { id: uid(), slot: 'pet', ilvl, rarity, species, affixes: {}, isNew: true };
  if (bossIdx != null) { const B = BOSS_PETS[bossIdx]; p.species = B.base; p.bossPet = B.id; p.name = B.name; p.rarity = 3; }
  else p.name = PETS[species].name + (rarity ? ' ' + ['', 'vif', 'farouche', 'alpha'][rarity] : '');
  return p;
}
const bossPetDef = p => p.bossPet ? BOSS_PETS.find(b => b.id === p.bossPet) : null;

function lootForFloor(r, floor, boss, luck) {
  const out = [];
  const tier = Math.min(TIERS.length - 1, Math.floor((floor - 1) / 10));
  if (boss && r.chance(BOSS_PET_CHANCE)) out.push(makePet(r, floor, 3, null, tier));
  if (r.chance(boss ? .15 : .05)) out.push(makePet(r, floor, Math.min(2, rollRarity(r, floor, boss)), r.weighted(PET_POOL)));
  const pick = () => r.weighted([['weapon', 4], ['armor', 3.5], ['talisman', 2.5]]);
  if (boss) {
    out.push(makeItem(r, pick(), floor, rollRarity(r, floor, true)));
    if (r.chance(.35)) out.push(makeItem(r, pick(), floor, rollRarity(r, floor, false)));
  } else if (r.chance(.42 + (luck || 0))) {
    out.push(makeItem(r, pick(), floor, rollRarity(r, floor, false)));
  }
  return out;
}

const salvageValue = it => Math.round((4 + it.ilvl * 1.8) * (1 + it.rarity * 1.3));

function affixText(k, v) {
  const A = AFFIXES[k];
  if (A.pct) return '+' + pct(v) + ' ' + A.label;
  return '+' + v + (A.suffix ? A.suffix : ' ' + A.label);
}

function starterWeapon(origin) {
  const it = makeItem(makeRng(hashStr(origin)), 'weapon', 1, 0);
  it.base = ORIGINS[origin].weapon; it.dmg = WEAPONS[it.base].dmg; it.name = WEAPONS[it.base].name + (it.base === 'marteau' ? ' usé' : ' usée');
  it.isNew = false;
  return it;
}

/* ---- 40-enemy.js ---- */
/* ===== ENNEMIS : un adversaire FIXE par étage (même seed monde = même gardien) ===== */
/* Courbe de difficulté : puissance cible par étage. Seul réglage à toucher pour l'équilibrage. */
const DIFF = { p0: 300, lin: .07, exp: 1.022 };
const targetPower = f => DIFF.p0 * Math.pow(1 + DIFF.lin * (f - 1), 2) * Math.pow(DIFF.exp, f - 1) * (1 - .2 * Math.max(0, 6 - f) / 5);

function makeEnemy(floor, worldSeed) {
  const r = makeRng(hashStr('etage:' + floor + ':' + worldSeed));
  const boss = floor % 10 === 0;
  const origin = r.pick(Object.keys(ORIGINS));
  const O = ORIGINS[origin];
  const base = { str: 2, agi: 2, spd: 2, end: 2, hp: 0 };
  for (const k of STAT_KEYS) base[k] += O.stats[k];
  const wl = STAT_KEYS.map(k => [k, O.weights[k]]);

  const nSk = Math.min(SKILL_IDS.length, (floor < 3 ? 0 : floor < 10 ? 1 : floor < 25 ? 2 : floor < 45 ? 3 : floor < 70 ? 5 : 7) + (boss ? 1 : 0));
  const skills = r.shuffle(SKILL_IDS).slice(0, nSk);

  const equip = {};
  const rar = () => Math.min(rollRarity(r, floor, false), floor < 8 ? 0 : floor < 15 ? 1 : 3);
  if (floor > 6 || r.chance(.14 * floor)) equip.weapon = makeItem(r, 'weapon', floor, boss ? 2 : rar());
  if (floor >= 3 && r.chance(Math.min(.9, .4 + floor * .02)) || boss) equip.armor = makeItem(r, 'armor', floor, boss ? 2 : rar());
  if (floor >= 8) equip.tal1 = makeItem(r, 'talisman', floor, rar());
  if (floor >= 22) equip.tal2 = makeItem(r, 'talisman', floor, rar());
  for (const k in equip) equip[k].isNew = false;
  const pets = [];
  let nPets = floor < 12 ? 0 : floor < 30 ? (r.chance(.4) ? 1 : 0) : floor < 60 ? 1 + (r.chance(.4) ? 1 : 0) : 2 + (r.chance(.3) ? 1 : 0);
  if (boss && floor >= 20) nPets = Math.min(3, nPets + 1);
  for (let i = 0; i < nPets; i++) { const pt = makePet(r, floor, Math.min(2, rar()), r.weighted(PET_POOL)); pt.isNew = false; pets.push(pt); }

  /* Ajuste les stats pour coller à la courbe (le boss garde son bonus x1.25 en plus) */
  const ent = { base, level: floor, skills, boss: false };
  const target = targetPower(floor);
  for (let guard = 0; guard < 400; guard++) {
    const p = teamPower(computeStats(ent, equip), pets);
    if (Math.abs(p - target) / target < .025) break;
    const tot = STAT_KEYS.reduce((a, k) => a + base[k], 0);
    const step = Math.max(1, Math.round(tot * Math.min(.08, Math.abs(p - target) / target / 3)));
    for (let i = 0; i < step; i++) {
      if (p < target) base[r.weighted(wl)]++;
      else { const k = r.weighted(wl); if (base[k] > 1) base[k]--; }
    }
  }

  const look = {
    skin: r.pick(LOOK.skin), hair: r.pick(LOOK.hairStyles), hairColor: r.pick(LOOK.hairColors), eyes: r.pick(LOOK.eyes),
    outfit: r.pick(LOOK.outfit), build: boss ? 'massif' : r.pick(LOOK.builds),
  };
  const tier = Math.min(TIERS.length - 1, Math.floor((floor - 1) / 10));
  const name = boss ? r.pick(NAME_A) + r.pick(NAME_B) : r.pick(NAME_A) + r.pick(NAME_B);
  const title = boss ? BOSS_TITLES[tier] : r.pick(TITLES);
  return { name, title, floor, level: floor, origin, base, skills, equip, pets, look, boss };
}

/* ---- 50-combat.js ---- */
/* ===== COMBAT : moteur pas à pas (déterministe), jouable en direct ou en automatique =====
   next() prépare le prochain coup (pré-tiré, donc le hasard ne dépend pas des actions du joueur),
   resolve(input) l'applique avec les actions du joueur : coup parfait, parade, techniques. */
function makeUnit(id, side, st, hp, name, main) {
  return { id, side, st, main, name, hp: hp == null ? st.maxHp : Math.min(hp, st.maxHp), t: 0, hits: 0, usedSouffle: false, firstDone: false,
    rage: 0, shield: 0, shieldVal: 0, stunTurns: 0, devastate: 0, weak: false, pierceN: 0 };
}

function createFight(heroEnt, heroEquip, heroPets, heroHp, enemy, seed) {
  const r = makeRng(seed);
  const units = [makeUnit('L', 'L', computeStats(heroEnt, heroEquip), heroHp, heroEnt.name, true)];
  (heroPets || []).filter(Boolean).forEach((p, i) => units.push(makeUnit('L' + (i + 1), 'L', petStats(p), null, p.name, false)));
  units.push(makeUnit('R', 'R', computeStats(enemy, enemy.equip), null, enemy.name, true));
  (enemy.pets || []).forEach((p, i) => units.push(makeUnit('R' + (i + 1), 'R', petStats(p), null, p.name, false)));
  const U = {}; for (const u of units) U[u.id] = u;
  U.L.rage = 20;
  const acts = {}; const lo = heroEnt.loadout || recommendLoadout(heroEnt, []);
  for (const id of lo) if (heroEnt.actives && heroEnt.actives[id]) acts[id] = heroEnt.actives[id];
  const F = { units, U, over: false, winner: null, turns: 0, cur: null, pending: null, actives: acts, startHp: U.L.hp };
  const alive = u => u.hp > 0;
  const snap = () => { const o = {}; for (const u of units) o[u.id] = Math.max(0, Math.round(u.hp)); return o; };
  F.snap = snap;
  F.rage = () => Math.round(U.L.rage);
  for (const u of units) { u.t = (100 / u.st.speed) * r.range(.5, 1); if (u.st.first) u.t *= .25; }

  const pickTarget = atk => {
    const foes = units.filter(u => u.side !== atk.side && alive(u));
    const main = foes.find(u => u.main), pets = foes.filter(u => !u.main);
    const roll = r(), pick = r();
    if (!pets.length || roll < (atk.main ? .6 : .7)) return main;
    return pets[Math.floor(pick * pets.length)];
  };
  const finish = () => {
    if (F.over) return;
    F.over = true; F.cur = null; F.pending = null;
    F.winner = !alive(U.L) ? 'R' : !alive(U.R) ? 'L' : (U.L.hp / U.L.st.maxHp >= U.R.hp / U.R.st.maxHp ? 'L' : 'R');
  };
  const checkOver = () => { if (!alive(U.L) || !alive(U.R) || F.turns >= 400) finish(); return F.over; };

  /* Prépare le coup suivant (ou commence un nouveau tour) */
  F.next = () => {
    if (F.over) return null;
    const events = [];
    if (!F.cur) {
      if (checkOver()) return null;
      F.turns++;
      let atk = null; for (const u of units) if (alive(u) && (!atk || u.t < atk.t)) atk = u;
      atk.t += 100 / atk.st.speed;
      if (atk.stunTurns > 0) { atk.stunTurns--; events.push({ type: 'stunned', who: atk.id, hp: snap() }); return { events, strike: null }; }
      if (atk.st.regen && atk.hp < atk.st.maxHp) { const h = Math.min(atk.st.regen, atk.st.maxHp - atk.hp); atk.hp += h; events.push({ type: 'regen', who: atk.id, heal: h, hp: snap() }); }
      F.cur = { atk, def: pickTarget(atk), n: 0, counter: false };
    }
    const { atk, def, counter } = F.cur;
    const p = { atk, def, counter, rEv: r(), rBl: r(), rDmg: r.range(.7, 1.3), rCrit: r(), rStun: r(), rCounter: r(), rCombo: r() };
    p.dodge = p.rEv < clamp(def.st.evade - atk.st.acc, .02, .6);
    p.block = !p.dodge && p.rBl < def.st.block;
    p.crit = p.rCrit < atk.st.crit || (!atk.firstDone && atk.st.skills.includes('premier'));
    p.heavy = atk.st.skills.includes('fracas') && (atk.hits + 1) % 3 === 0;
    p.dangerous = def.id === 'L' && !p.dodge && !p.block && (p.crit || p.heavy);
    F.pending = p;
    return { events, strike: { a: atk.id, d: def.id, counter, telegraph: p.dangerous, heroStrike: atk.id === 'L' } };
  };

  /* Applique le coup préparé. input = { perfect, parry } */
  F.resolve = input => {
    input = input || {};
    const p = F.pending; if (!p) return { events: [], cont: null };
    F.pending = null;
    const { atk, def, counter } = p;
    const events = [];
    atk.hits++; atk.firstDone = true;
    const base = { type: 'atk', a: atk.id, d: def.id, counter };
    let miss = false;
    const devast = atk.devastate;
    if (!devast && p.dodge) { events.push({ ...base, res: 'dodge' }); miss = true; }
    else if (!devast && p.block) { events.push({ ...base, res: 'block' }); miss = true; }
    else {
      let d = atk.st.dmg * p.rDmg;
      const e = { ...base, res: 'hit', crit: p.crit, heavy: p.heavy };
      if (p.crit) d *= atk.st.critMult;
      if (p.heavy) d *= 2;
      if (atk.st.skills.includes('furie') && atk.hp / atk.st.maxHp < .4) d *= 1.4;
      if (def.st.skills.includes('regard')) d *= .88;
      if (atk.weak) d *= .9;
      if (devast) { d *= devast; e.devast = true; atk.devastate = 0; }
      if (atk.id === 'L' && input.perfect) { d *= PERFECT_MULT; e.perfect = true; }
      if (def.id === 'L' && input.parry && p.dangerous) { d *= PARRY_MULT; e.parried = true; }
      if (def.shield > 0) { d *= 1 - def.shieldVal; def.shield--; e.shielded = true; }
      let arm = def.st.armor * (1 - atk.st.pierce);
      if (atk.pierceN > 0) { arm = 0; atk.pierceN--; e.pierce = true; }
      d *= 1 - arm / (arm + 50);
      d = Math.max(1, Math.round(d));
      def.hp -= d; e.dmg = d;
      if (atk.st.stun && def.hp > 0 && p.rStun < atk.st.stun) { def.t += 70 / def.st.speed; e.stun = true; }
      if (atk.st.lifesteal) { const h = Math.round(d * atk.st.lifesteal); if (h > 0) { atk.hp = Math.min(atk.st.maxHp, atk.hp + h); e.heal = h; } }
      if (def.st.thorns && def.hp > 0) { const t = Math.max(1, Math.round(d * def.st.thorns)); atk.hp -= t; e.thorns = t; }
      if (def.id === 'L') U.L.rage = Math.min(RAGE.max, U.L.rage + RAGE.onHit);
      e.hp = snap(); events.push(e);
      if (def.hp <= 0 && !def.main && !def._downSent) { def._downSent = true; events.push({ type: 'down', id: def.id, hp: snap() }); }
      if (atk.hp <= 0 && !atk.main && !atk._downSent) { atk._downSent = true; events.push({ type: 'down', id: atk.id, hp: snap() }); }
      if (def.hp > 0 && !def.usedSouffle && def.st.skills.includes('souffle') && def.hp / def.st.maxHp < .3) {
        def.usedSouffle = true; const h = Math.round(def.st.maxHp * .35); def.hp = Math.min(def.st.maxHp, def.hp + h);
        events.push({ type: 'skill', who: def.id, id: 'souffle', heal: h, hp: snap() });
      }
    }
    if (miss) events[events.length - 1].hp = snap();
    if (atk.id === 'L') U.L.rage = Math.min(RAGE.max, U.L.rage + RAGE.onStrike);
    let cont = null;
    if (checkOver()) cont = null;
    else if (!alive(def) || !alive(atk)) F.cur = null;
    else if (miss) {
      if (!counter && def.st.skills.includes('riposte') && p.rCounter < .35) { F.cur = { atk: def, def: atk, n: 0, counter: true }; cont = 'counter'; }
      else F.cur = null;
    } else if (!counter) {
      F.cur.n++;
      if (F.cur.n < 4 && p.rCombo < atk.st.combo) cont = 'combo'; else F.cur = null;
    } else F.cur = null;
    return { events, cont };
  };

  /* Technique active du héros */
  F.canUse = id => !F.over && F.actives[id] && U.L.rage >= ACTIVES[id].cost && alive(U.L);
  F.useActive = id => {
    if (!F.canUse(id)) return null;
    const A = ACTIVES[id], rank = F.actives[id], v = A.val[rank - 1];
    U.L.rage -= A.cost;
    const e = { type: 'active', who: 'L', id };
    if (id === 'devaste') U.L.devastate = v;
    else if (id === 'bouclier') { U.L.shield = 2; U.L.shieldVal = v; }
    else if (id === 'soin') { const h = Math.min(U.L.st.maxHp - U.L.hp, Math.round(U.L.st.maxHp * v)); U.L.hp += h; e.heal = h; }
    else if (id === 'cri') { U.R.stunTurns += v; if (rank >= 2) U.R.weak = true; }
    else if (id === 'brise') U.L.pierceN = v;
    else if (id === 'balayage') {
      e.hits = [];
      for (const u of units) if (u.side === 'R' && alive(u)) {
        const dd = Math.max(1, Math.round(U.L.st.dmg * v * (u.main ? .5 : 1)));
        u.hp -= dd; e.hits.push({ id: u.id, dmg: dd });
      }
    }
    e.hp = snap();
    const out = [e];
    for (const u of units) if (u.side === 'R' && !u.main && u.hp <= 0 && !u._downSent) { u._downSent = true; out.push({ type: 'down', id: u.id, hp: snap() }); }
    checkOver();
    return out;
  };
  /* Joueur automatique : utilise ses techniques dès que possible, sans chercher le bon moment */
  F.autoActives = () => {
    const out = [];
    for (const id of ACTIVE_IDS) {
      if (!F.canUse(id)) continue;
      if (id === 'soin' && U.L.hp / U.L.st.maxHp > .5) continue;
      if (id === 'devaste' && U.L.devastate) continue;
      if (id === 'bouclier' && U.L.shield) continue;
      if (id === 'brise' && U.L.pierceN) continue;
      if (id === 'balayage' && !units.some(u => u.side === 'R' && !u.main && alive(u))) continue;
      out.push(...F.useActive(id));
    }
    return out;
  };
  F.info = () => { const o = {}; for (const u of units) o[u.id] = { max: u.st.maxHp, name: u.name, main: u.main }; o.L.start = F.startHp; return o; };
  F.result = events => ({ events, winner: F.winner, heroHp: Math.max(0, Math.round(U.L.hp)), units: F.info() });
  /* Termine le combat en automatique (bouton Passer) et renvoie les événements restants */
  F.runAuto = () => {
    const evs = [];
    if (F.pending) evs.push(...F.resolve({}).events);
    let guard = 0;
    while (!F.over && guard++ < 5000) {
      evs.push(...F.autoActives());
      const n = F.next(); if (!n) break;
      evs.push(...n.events);
      if (n.strike) evs.push(...F.resolve({}).events);
    }
    finish();
    return evs;
  };
  return F;
}

/* Combat entièrement automatique (estimation, bot d'équilibrage, combat interrompu) */
function simulateFight(heroEnt, heroEquip, heroPets, heroHp, enemy, seed, opts) {
  const F = createFight(heroEnt, heroEquip, heroPets, heroHp, enemy, seed);
  const events = F.runAuto();
  if (!(opts && opts.noEvents)) events.push({ type: 'end', winner: F.winner, hp: F.snap() });
  return F.result(opts && opts.noEvents ? [] : events);
}

/* Estimation Monte-Carlo (jeu automatique) : affichée au joueur pour décider « je pousse ou j'encaisse ». */
function winChance(heroEnt, heroEquip, heroPets, heroHp, enemy, n) {
  n = n || 80; let w = 0;
  for (let i = 0; i < n; i++) if (simulateFight(heroEnt, heroEquip, heroPets, heroHp, enemy, 7919 * i + 13, { noEvents: true }).winner === 'L') w++;
  return w / n;
}

const Previews = new Set();

  opts = opts || {};

  for (const it of Previews) {
    if (!it.canvas.isConnected) { Previews.delete(it); continue; }
    const cv = it.canvas, dpr = Math.min(3, window.devicePixelRatio || 1);
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) continue;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    const v = it.getView(); if (!v) continue;
    const s = (h / 120) * (it.opts.zoom || 1) * dpr;
    const ty = it.opts.cy != null ? cv.height / 2 - it.opts.cy * s : cv.height - (it.opts.dy == null ? 8 : it.opts.dy) * s;
    c.setTransform(s, 0, 0, s, cv.width / 2 + (it.opts.dx || 0) * s, ty);
    v.x = 0; v.y = 0;
    updateView(v, 16);
    drawFighter(c, v, t);
  }
  if (Previews.size) requestAnimationFrame(previewLoop); else attachPreview._running = false;
}

    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));

}

/* ===== MAIN : état, sauvegarde, écrans ===== */
const SAVE_KEY = 'fighters.save.v2';
const INV_MAX = 60;
let S = null, tab = 'tour', alloc = null, heroSub = 'stats';
let _enemies = {};

function save() {
  if (S) S.savedAt = Date.now();
  try { if (S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* stockage navigateur indisponible */ }
  cloudPush();
}

/* ---------- Sauvegarde cloud (capacité db de la page publiée) ----------
   Une partie par personne, privée : data/users/<id>/save. Le navigateur sert de cache et de secours. */
const Cloud = { ref: null, status: 'local', busy: false, dirty: false, timer: null };
async function cloudInit() {
  const C = window.claude;
  if (!C || !C.use) return;
  try {
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/save');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 10000))]);
    Cloud.ref = ref; Cloud.status = 'cloud';
    const d = snap.exists ? snap.data() : null;
    if (d && typeof d.json === 'string') {
      const remote = JSON.parse(d.json);
      if (remote && remote.v === 2 && (!S || (remote.savedAt || 0) > (S.savedAt || 0))) {
        S = remote; _enemies = {}; try { localStorage.setItem(SAVE_KEY, d.json); } catch (e) { }
        if (!document.querySelector('.fight')) render();
        toast('Partie restaurée');
        return;
      }
    }
    if (S) cloudPush();
  } catch (e) { Cloud.ref = null; Cloud.status = 'local'; }
}
function cloudPush() {
  if (!Cloud.ref) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(cloudWrite, 700);
}
async function cloudWrite() {
  if (!Cloud.ref) return;
  if (Cloud.busy) { Cloud.dirty = true; return; }
  Cloud.busy = true; Cloud.dirty = false;
  try {
    if (S) await Cloud.ref.set({ json: JSON.stringify(S), savedAt: S.savedAt || Date.now() });
    else await Cloud.ref.delete();
    Cloud.status = 'cloud';
  } catch (e) {
    const c = e && e.code;
    if (c === 'unavailable') Cloud.dirty = true;
    else { Cloud.ref = null; Cloud.status = 'local'; }
  }
  Cloud.busy = false;
  if (Cloud.dirty) { Cloud.dirty = false; setTimeout(cloudWrite, 1500); }
}
function load() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
const heroStats = () => computeStats(S.hero, S.equip);
const myPets = () => S.pets.slice(0, petSlots(S.hero.level)).filter(Boolean);
function enemyAt(f) { const k = f + ':' + S.world; return _enemies[k] || (_enemies[k] = makeEnemy(f, S.world)); }
const randomName = () => { const r = makeRng((Math.random() * 1e9) | 0); return r.pick(NAME_A) + r.pick(NAME_B); };
const rnd = () => makeRng((Math.random() * 2 ** 31) | 0);

/* Codex : tout ce que le héros a déjà possédé (armes, familiers). Pouvoirs = hero.skills. */
function note(it) {
  if (!S.codex) S.codex = { w: {}, p: {} };
  if (it.slot === 'weapon') S.codex.w[it.base] = 1;
  if (it.slot === 'pet') S.codex.p[it.bossPet || it.species] = 1;
}
function ensureCodex() {
  if (S.codex) return;
  S.codex = { w: {}, p: {} };
  [...S.inv, ...Object.values(S.equip), ...S.pets].filter(Boolean).forEach(note);
}
function newGame(name, look, origin) {
  S = { v: 2, world: (Math.random() * 1e9) | 0, hero: newHero(name, look, origin), equip: { weapon: starterWeapon(origin) }, pets: [null, null, null], inv: [],
    portals: [1], best: 0, stats: { runs: 0, wins: 0, deaths: 0, fights: 0 }, run: null, lastRun: null, pendingChoice: null, tips: {}, sound: true, speed: 2, autoEquip: true, codex: { w: {}, p: {} } };
  note(S.equip.weapon);
  save();
}
/* Techniques emportées contre l'adversaire d'un étage : choix du joueur, sinon conseil automatique */
function curLoadout(f) {
  const learned = ACTIVE_IDS.filter(id => activeRank(S.hero, id) > 0);
  if (S.lo && S.lo.floor === f) return S.lo.ids.filter(id => learned.includes(id)).slice(0, activeSlots(S.hero.level));
  const en = enemyAt(f);
  return recommendLoadout(S.hero, enemyTraits(en, heroStats()));
}
const heroFor = f => Object.assign({}, S.hero, { loadout: curLoadout(f) });
const startFloor = () => S.portals.includes(S._portalSel) ? S._portalSel : Math.max(...S.portals);

/* ---------- Run rogue-lite ---------- */
function startRun(from) {
  S.run = { start: from, floor: from, hp: heroStats().maxHp, flasks: 3, xp: 0, loot: [], wins: 0 };
  S.lastRun = null; S.stats.runs++; save();
}
function secureLoot() {
  const run = S.run; let overflow = 0;
  for (const it of run.loot) { S.inv.push(it); note(it); }
  while (S.inv.length > INV_MAX) { const worst = S.inv.reduce((a, b) => (itemScore(b) < itemScore(a) ? b : a)); S.inv.splice(S.inv.indexOf(worst), 1); overflow += salvageValue(worst); }
  run.xp += overflow;
  const n = run.loot.length; run.loot = []; return n;
}
function endRun(reason) {
  const run = S.run, from = S.hero.level;
  const lost = reason === 'death' ? run.loot.length : 0;
  const secured = reason === 'death' ? 0 : secureLoot();
  if (reason === 'death') run.loot = [];
  const kept = reason === 'death' ? Math.floor(run.xp * DEATH_XP_KEEP) : run.xp;
  const levels = grantXp(S.hero, kept);
  S.lastRun = { reason, start: run.start, reached: run.floor - (reason === 'death' ? 0 : 1), wins: run.wins, xp: kept, xpLost: run.xp - kept, from, to: S.hero.level, points: levels * POINTS_PER_LEVEL, lost, secured };
  S.run = null; S.tips.start = 1;
  if (S.autoEquip !== false) S.lastRun.equipped = autoEquipAll();
  if (S.autoAlloc && S.hero.points) { alloc = { str: 0, agi: 0, spd: 0, end: 0 }; autoAlloc(S.hero.points); for (const k of STAT_KEYS) S.hero.base[k] += alloc[k]; S.hero.points = 0; alloc = null; }
  save();
}
function applyOutcome(en, res) {
  const run = S.run, floor = run.floor, st = heroStats();
  S.stats.fights++;
  const out = { floor, win: res.winner === 'L', boss: en.boss, orbXp: res.orbXp || 0 };
  run.xp += out.orbXp;
  if (!out.win) { S.stats.deaths++; out.lostLoot = run.loot.length; endRun('death'); return out; }
  S.stats.wins++; run.wins++;
  out.xp = Math.round(xpReward(floor) * (1 + st.xpBonus)); run.xp += out.xp;
  out.loot = lootForFloor(rnd(), floor, en.boss, 0);
  run.loot.push(...out.loot);
  out.healed = Math.min(st.maxHp - res.heroHp, Math.round(st.maxHp * WIN_HEAL));
  run.hp = res.heroHp + out.healed;
  if (floor > S.best) { S.best = floor; out.record = true; }
  if (floor % 5 === 0) { out.sanctuary = true; run.hp = st.maxHp; run.flasks = 3; }
  if (floor % 10 === 0 && !S.portals.includes(floor + 1)) { S.portals.push(floor + 1); out.portal = floor + 1; }
  run.floor++;
  return out;
}

/* ---------- Équipement et familiers ---------- */
function bestSlotFor(it) {
  if (it.slot === 'pet') { const n = petSlots(S.hero.level); for (let i = 0; i < n; i++) if (!S.pets[i]) return i; let w = -1, wp = Infinity; for (let i = 0; i < n; i++) { const p = petStats(S.pets[i]).power; if (p < wp) { wp = p; w = i; } } return w; }
  if (it.slot !== 'talisman') return it.slot;
  if (!S.equip.tal1) return 'tal1'; if (!S.equip.tal2) return 'tal2';
  return computeStats(S.hero, { ...S.equip, tal1: it }).power >= computeStats(S.hero, { ...S.equip, tal2: it }).power ? 'tal1' : 'tal2';
}
function deltaFor(it, slot) {
  if (slot == null) slot = bestSlotFor(it);
  if (it.slot === 'pet') { if (slot < 0) return 0; const cur = S.pets[slot]; return Math.round((petStats(it).power - (cur ? petStats(cur).power : 0)) * .7); }
  return computeStats(S.hero, { ...S.equip, [slot]: it }).power - heroStats().power;
}
const itemScore = it => deltaFor(it) + it.rarity * 5 + (it.bossPet ? 1e6 : 0);
function equip(it, slot, quiet) {
  if (slot == null) slot = bestSlotFor(it);
  S.inv.splice(S.inv.indexOf(it), 1);
  if (it.slot === 'pet') { const old = S.pets[slot]; if (old) S.inv.push(old); S.pets[slot] = it; }
  else { const old = S.equip[slot]; if (old) { old.isNew = false; S.inv.push(old); } S.equip[slot] = it; if (S.run) S.run.hp = Math.min(S.run.hp, heroStats().maxHp); }
  it.isNew = false; if (quiet) return; save(); Sfx.play('tap'); toast(it.name + ' équipé');
}
/* Équipe tout ce qui augmente la puissance (armes, armure, talismans, familiers). Renvoie le nombre d'objets équipés. */
const upgrades = () => S.inv.filter(it => (it.slot !== 'pet' || petSlots(S.hero.level) > 0) && deltaFor(it) > 0);
function autoEquipAll() {
  let n = 0;
  for (let g = 0; g < 30; g++) {
    const ups = upgrades(); if (!ups.length) break;
    const best = ups.reduce((a, b) => (deltaFor(b) > deltaFor(a) ? b : a));
    equip(best, null, true); n++;
  }
  return n;
}
function salvage(it) {
  S.inv.splice(S.inv.indexOf(it), 1); const v = salvageValue(it);
  if (S.run) S.run.xp += v; else grantXp(S.hero, v);
  save(); Sfx.play('xp'); return v;
}

/* ---------- Combat interactif ---------- */

  Sfx.init(); Sfx.on = S.sound;
  try { await document.fonts.load('20px "Lilita One"'); } catch (e) { /* police de secours */ }
  const floor = S.run.floor, en = enemyAt(floor), seed = (Math.random() * 2 ** 31) | 0, lo = curLoadout(floor);
  const heroEnt = JSON.parse(JSON.stringify(heroFor(floor))), heroEq = JSON.parse(JSON.stringify(S.equip)), pets = JSON.parse(JSON.stringify(myPets()));
  S.pendingFight = { floor, seed, lo }; save(); // recharger la page ne permet pas d'annuler une défaite
  const F = createFight(heroEnt, heroEq, pets, S.run.hp, en, seed);
  showFight(heroEnt, heroEq, pets, en, F, floor);
}
/* Combat commencé mais jamais terminé (page fermée) : résolu en automatique avec le même tirage */

  const P = S.pendingFight; S.pendingFight = null;

  const res = simulateFight(Object.assign({}, S.hero, { loadout: P.lo }), S.equip, myPets(), S.run.hp, enemyAt(P.floor), P.seed, { noEvents: true });
  const out = applyOutcome(enemyAt(P.floor), res); save();

}

/* Comparaison claire : ce qui est équipé vs ce qui le remplacerait, stat par stat */
const CMP_ROWS = [

function itemOwnLines(it) {

const SLOT_NAMES = { weapon: 'Arme', armor: 'Armure', tal1: 'Talisman I', tal2: 'Talisman II' };
