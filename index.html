<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181a28">
<title>Climbrawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Concept : fantasy steampunk au crépuscule, interface en flat design pastel.
   Fonds unis gris-bleu, coins arrondis, aucun dégradé ni halo. Une couleur = un sens :
   beurre = action principale / XP, ciel = défense / info, menthe = positif, pêche = attaque / rage,
   corail = danger, lavande = choix secondaire. Le décor du palier sert de fond flouté. */
:root {
  --bg: #181a28; --surface: #23263a; --surface-2: #2d3149; --surface-3: #383d58; --line: rgba(255,255,255,.08);
  --butter: #ffdb8f; --sky: #9cc9ff; --mint: #94e2bd; --peach: #ffb994; --coral: #ff9b9b; --lavender: #c9b8ff;
  --on: #1b1d2c; /* texte sombre sur fond pastel */
  --gold: var(--butter); --cyan: var(--sky); --heal: var(--mint); --blood: var(--coral); --soul: var(--lavender);
  --text: #eceef6; --muted: #a2a8c3; --muted-ink: #a2a8c3; --ink: #12131d; --card: var(--surface); --card-2: var(--surface-2);
  --f-display: "Permanent Marker", "Arial Black", Impact, sans-serif;
  --f-ui: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
  --f-body: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
  --f-souls: "Permanent Marker", Impact, sans-serif;
  --r: 14px; --r-sm: 10px;
  --bd: none;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; touch-action: manipulation; background: var(--bg); color: var(--text); font-family: var(--f-body); font-weight: 500; font-size: 15px; overflow: hidden; user-select: none; -webkit-user-select: none; }
body::before { content: ""; position: fixed; inset: -12px; pointer-events: none; background: var(--bd) center 28% / cover no-repeat, var(--bg); filter: blur(4px) brightness(.42) saturate(.55); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: rgba(24,26,40,.45); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
#app { position: relative; z-index: 1; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 520px) { #app { box-shadow: 0 0 0 1px var(--line); } }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; letter-spacing: .5px; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Composants ---------- */
.panel { position: relative; padding: 12px; color: var(--text); background: var(--surface); border-radius: var(--r); }
.panel.dark { background: var(--surface); }
.panel.flat { background: var(--surface-2); border-radius: var(--r-sm); }
.label { font-family: var(--f-ui); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-ui); font-weight: 700; font-size: 18px; letter-spacing: .2px; padding: 12px 18px;
  color: var(--text); background: var(--surface-3); border-radius: 12px; transition: transform .06s, filter .1s; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-gold { background: var(--butter); color: var(--on); }
.btn-soul { background: var(--lavender); color: var(--on); }
.btn-stone { background: var(--surface-3); color: var(--text); }
.btn-blood { background: var(--coral); color: var(--on); }
.btn-ghost { background: none; color: var(--muted); font-size: 15px; padding: 6px; }
.btn-big { width: 100%; font-size: 21px; padding: 15px; }
.btn-sm { font-size: 15px; padding: 8px 14px; border-radius: 10px; }
.btn .delta { font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; font-family: var(--f-ui); font-weight: 600; font-size: 13px; color: var(--text); background: var(--surface-3); border-radius: 999px; }
.chip.hot { background: var(--butter); color: var(--on); font-weight: 700; font-size: 14px; }
.soulc { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-ui); font-weight: 700; font-size: 18px; color: inherit; }
.ico { display: inline-block; vertical-align: middle; flex: none; }
.bar { position: relative; height: 16px; background: var(--surface-3); border-radius: 8px; overflow: hidden; }
.bar > .trail, .bar > .fill { position: absolute; inset: 0 auto 0 0; transition: width .25s ease-out; }
.bar > .trail { background: rgba(255,255,255,.35); transition: width .7s .25s ease-out; }
.bar > .fill { background: var(--mint); }
.bar > .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-ui); font-weight: 700; font-size: 12px; color: var(--on); }
.xpbar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.xpbar i { display: block; height: 100%; background: var(--sky); }
.minis { display: flex; gap: 3px; margin-top: 4px; }
.mini { flex: 1; height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; max-width: 40px; }
.mini i { display: block; height: 100%; background: var(--mint); transition: width .25s; }

/* ---------- Barre haute / nav ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); background: var(--surface); }
.top .avatar { width: 50px; height: 50px; flex: none; background: var(--surface-3); border-radius: 12px; }
.top .name { font-family: var(--f-ui); font-weight: 700; font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-top: 1px; }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0; color: var(--muted); font-family: var(--f-ui); font-weight: 600; font-size: 14px; position: relative; border-radius: 12px; }
.nav button.on { color: var(--text); background: var(--surface-2); }
.nav button.on::after { content: ""; position: absolute; bottom: 2px; left: 38%; right: 38%; height: 3px; border-radius: 2px; background: var(--butter); }
.nav .badge { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 19px; height: 19px; border-radius: 10px; background: var(--coral); color: var(--on); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

/* ---------- Tour ---------- */
.tier { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tier h2 { font-size: 25px; color: var(--text); }
.prog { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--butter); }
.strip { display: flex; flex-direction: column; gap: 4px; }
.floor { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 7px 12px; background: var(--surface); border-radius: var(--r-sm); color: var(--muted); font-family: var(--f-ui); font-size: 14px; }
.floor .n { font-family: var(--f-ui); font-weight: 700; font-size: 18px; color: var(--text); text-align: center; }
.floor.done { opacity: .5; }
.floor.cur { background: var(--butter); color: var(--on); }
.floor.cur .n { color: var(--on); }
.floor .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.portals { display: flex; flex-wrap: wrap; gap: 6px; }
.foe { display: grid; grid-template-columns: 112px 1fr; gap: 12px; }
.foe canvas, .hero-card canvas, .create-prev, .petbig { background: linear-gradient(180deg, #2f3350 0%, #2f3350 64%, #23263a 64%); border-radius: 12px; }
.foe canvas { width: 112px; height: 140px; }
.foe h3 { font-family: var(--f-ui); font-weight: 700; font-size: 22px; line-height: 1.05; }
.foe .title { font-family: var(--f-ui); font-size: 14px; color: var(--muted); margin-top: 2px; }
.excl { margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255,219,143,.12); border-radius: var(--r-sm); font-family: var(--f-ui); font-weight: 600; font-size: 14px; color: var(--butter); }
.excl .ico { color: var(--butter); }
.odds { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.odds .meter { flex: 1; height: 10px; background: var(--surface-3); border-radius: 5px; overflow: hidden; }
.odds .meter i { display: block; height: 100%; }
.odds b { font-family: var(--f-ui); font-weight: 700; font-size: 18px; min-width: 48px; text-align: right; }
.flasks { display: flex; gap: 4px; }
.tip { display: flex; gap: 10px; align-items: flex-start; background: rgba(156,201,255,.1); border-left: 3px solid var(--sky); border-radius: var(--r-sm); padding: 10px 12px; font-family: var(--f-ui); font-size: 14px; line-height: 1.4; color: var(--text); }
.tip.warm { background: rgba(255,185,148,.1); border-left-color: var(--peach); }
.tip button { margin-left: auto; font-size: 22px; line-height: 1; padding: 0 2px; color: var(--muted); }
.summary .x { font-size: 24px; line-height: 1; color: var(--muted); padding: 0 4px; }
.sumgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sumgrid div { background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 4px; text-align: center; }
.sumgrid span { display: block; font-family: var(--f-ui); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.sumgrid b { font-family: var(--f-ui); font-weight: 700; font-size: 15px; }

/* ---------- Héros ---------- */
.hero-card { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; }
.hero-card canvas { width: 130px; height: 180px; }
.power { font-family: var(--f-ui); font-weight: 700; font-size: 30px; line-height: 1; color: var(--text); }
.power small { font-size: 15px; }
.alloc { display: flex; flex-direction: column; gap: 6px; }
.arow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-sm); }
.arow b { display: block; font-family: var(--f-ui); font-weight: 700; font-size: 17px; }
.arow small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.arow .val { min-width: 64px; text-align: center; font-family: var(--f-ui); font-weight: 700; font-size: 21px; }
.arow .val small { display: inline; font-size: 12px; color: var(--sky); }
.arow .val em { font-style: normal; font-size: 13px; color: var(--mint); }
.pm { width: 40px; height: 40px; display: grid; place-items: center; background: var(--surface-3); border-radius: 10px; }
.pm .ico svg { stroke: var(--text); }
.pm.plus { background: var(--butter); }
.pm.plus .ico svg { stroke: var(--on); }
.pm:active:not(:disabled) { transform: translateY(1px); }
.pm:disabled { opacity: .3; }
.derived { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 15px; }
.derived div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 4px 0; }
.derived span { color: var(--muted); }
.skills { display: flex; flex-direction: column; gap: 6px; }
.skill { padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-sm); font-size: 13px; line-height: 1.35; }
.skill b { font-family: var(--f-ui); font-weight: 700; font-size: 16px; display: block; }
.choice { box-shadow: inset 0 0 0 2px var(--butter); }

/* ---------- Sac ---------- */
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slots.three { grid-template-columns: repeat(3, 1fr); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; background: var(--rbg, var(--surface-2)); border: 2px solid transparent; border-radius: 12px; color: var(--text); overflow: hidden; }
.tile:active { transform: scale(.96); }
.tile .lv { position: absolute; bottom: 2px; right: 6px; font-family: var(--f-ui); font-weight: 700; font-size: 12px; }
.tile .up { position: absolute; top: 2px; left: 5px; color: var(--mint); font-size: 14px; }
.tile .new { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
.tile.empty { background: rgba(255,255,255,.03); border: 2px dashed var(--line); }
.tile.locked { background: rgba(0,0,0,.25); }
.petslot canvas, .petcv { width: 100%; height: 100%; }
.slotlab { font-family: var(--f-ui); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 4px; font-weight: 700; }

/* ---------- Combat : décor plein écran, HUD flat par-dessus ---------- */
.fight { position: absolute; inset: 0; z-index: 20; background: #000; overflow: hidden; touch-action: none; }
.fight .arena { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fhud { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr 56px 1fr; gap: 6px; align-items: start; padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 0; pointer-events: none; }
.fhud button { pointer-events: auto; }
.fside { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: center; min-width: 0; padding: 5px; background: rgba(24,26,40,.88); border-radius: 14px; }
.fside.R { grid-template-columns: 1fr 52px; text-align: right; }
.fside.R .pframe { order: 2; }
.pframe { width: 52px; height: 52px; position: relative; padding: 2px; background: var(--sky); border-radius: 11px; }
.fside.R .pframe { background: var(--coral); }
.pframe .pc { width: 100%; height: 100%; display: block; background: var(--surface-2); border-radius: 9px; }
.pinfo { min-width: 0; }
.fside .nm { font-family: var(--f-ui); font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.hpb { position: relative; height: 16px; background: var(--surface-3); border-radius: 8px; overflow: hidden; }
.hpb .trail, .hpb .fill { position: absolute; top: 0; bottom: 0; left: 0; transition: width .25s ease-out; }
.hpb .trail { background: rgba(255,255,255,.4); transition: width .7s .25s ease-out; }
.hpb .fill { background: var(--mint); }
.fside.R .hpb .fill { background: var(--coral); }
.fside.R .hpb .trail, .fside.R .hpb .fill { left: auto; right: 0; }
.hpb span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-ui); font-weight: 700; font-size: 12px; color: var(--on); }
.fside.R .minis { justify-content: flex-end; }
.fl { width: 56px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text); background: rgba(24,26,40,.88); border-radius: 14px; }
.fl span { font-family: var(--f-ui); font-weight: 600; font-size: 12px; line-height: 1; color: var(--muted); }
.fl b { font-family: var(--f-ui); font-weight: 700; font-size: 26px; line-height: 1.05; color: var(--butter); }
.pausebtn { position: absolute; top: calc(76px + env(safe-area-inset-top, 0px)); right: 8px; width: 42px; height: 42px; display: grid; place-items: center; background: rgba(24,26,40,.88); border-radius: 12px; }
.fbanner { position: absolute; left: 0; right: 0; top: 19%; display: flex; flex-direction: column; align-items: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
.fbanner.on { opacity: 1; animation: bannerIn .4s cubic-bezier(.2,1.3,.4,1); }
.fbanner .brush { position: relative; padding: 12px 28px 14px; transform: rotate(-4deg); text-align: center; background: rgba(24,26,40,.92); border-radius: 16px; }
.fbanner .brush::after { content: ""; position: absolute; left: 28px; right: 28px; bottom: 8px; height: 4px; border-radius: 2px; background: var(--butter); }
.fbanner h2 { font-size: 40px; line-height: 1; color: var(--butter); text-transform: uppercase; white-space: nowrap; }
.fbanner p { margin: 6px 0 4px; font-family: var(--f-ui); font-weight: 600; font-size: 18px; color: var(--text); }
.fbanner .bnum { margin-top: 12px; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-ui); font-weight: 700; font-size: 38px; color: var(--on); background: var(--butter); }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.25); } }
.fbottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(24,26,40,.94); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 8px; }
.rage { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 2px 4px; }
.rl { font-family: var(--f-ui); font-weight: 700; font-size: 14px; letter-spacing: 1.5px; line-height: 1; color: var(--peach); text-transform: uppercase; }
.rbar { height: 12px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.rbar i { display: block; height: 100%; width: 0; background: var(--peach); transition: width .3s; }
.rv { font-family: var(--f-ui); font-weight: 700; font-size: 16px; color: var(--text); }
.abil { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ab { position: relative; display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 8px; min-height: 84px; padding: 10px 10px 30px; text-align: left; color: var(--muted); background: var(--surface-2); border-radius: 14px; transition: background .2s, color .2s, transform .1s; }
.ab .abic { opacity: .55; }
.ab.ready .abic { opacity: 1; }
.ab.def.ready { background: var(--sky); color: var(--on); }
.ab.off.ready { background: var(--peach); color: var(--on); }
.ab.armed { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--text); }
.ab:active { transform: scale(.97); }
.abic { display: grid; place-items: center; }
.abtx { min-width: 0; }
.abtx b { display: block; font-family: var(--f-ui); font-weight: 700; font-size: 16px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.abtx small { display: block; font-family: var(--f-ui); font-weight: 500; font-size: 13px; opacity: .85; margin-top: 1px; white-space: nowrap; }
.ab .cost { position: absolute; left: 10px; bottom: 7px; display: inline-flex; align-items: center; gap: 3px; padding: 1px 9px; font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: var(--text); background: rgba(18,19,29,.7); border-radius: 999px; }
.ab em { position: absolute; bottom: 8px; right: 10px; font-style: normal; font-family: var(--f-ui); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: 0; }
.ab.armed em { opacity: 1; }
/* Retours des techniques : en attente (contour qui pulse), lancée (flash + saut), refusée (tremble) */
.ab.armed { animation: armed .7s ease-in-out infinite alternate; }
@keyframes armed { from { box-shadow: 0 0 0 3px var(--text); } to { box-shadow: 0 0 0 5px var(--text), 0 0 18px 4px rgba(255,255,255,.35); } }
.ab.fired { animation: fired .6s cubic-bezier(.2,1.4,.4,1); }
.ab.fired::after { content: "Lancée !"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: var(--on); background: #fff; border-radius: 14px; animation: firedTag .9s ease-out forwards; pointer-events: none; }
@keyframes fired { 0% { transform: scale(1); } 30% { transform: scale(1.08) translateY(-6px); } 100% { transform: scale(1); } }
@keyframes firedTag { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }
.nope { animation: nope .35s; }
@keyframes nope { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.rage.nope .rbar { box-shadow: 0 0 0 2px var(--coral); }
.rage.nope .rl, .rage.nope .rv { color: var(--coral); }
.rage.spent .rbar { animation: spent .6s ease-out; }
@keyframes spent { 0% { box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(255,255,255,.6); } 100% { box-shadow: 0 0 0 0 transparent; } }
.finfo { display: flex; align-items: center; gap: 10px; padding: 6px 6px 0; font-family: var(--f-ui); font-weight: 600; font-size: 14px; color: var(--muted); }
.finfo .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.finfo .tw { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; color: var(--text); padding-left: 12px; border-left: 1px solid var(--line); }

/* ---------- Overlays ---------- */
.ov { position: absolute; inset: 0; z-index: 40; background: rgba(12,13,20,.6); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.ov.center { align-items: center; }

/* ===== PERSONNAGE : stats dérivées, puissance, niveaux ===== */
function newHero(name, look, origin) {
  const base = { str: 3, agi: 3, spd: 3, end: 3, hp: 0 };
  for (const k of STAT_KEYS) base[k] += ORIGINS[origin].stats[k];
  return { name, look, origin, base, level: 1, xp: 0, points: 0, choices: 0, skills: [], tp: 0, actives: { devaste: 1 } };
}

/* Entité = { base, level, skills, boss? } + équipement { weapon, armor, tal1, tal2 } */
function computeStats(ent, equip) {
  equip = equip || {};
  const s = { str: ent.base.str, agi: ent.base.agi, spd: ent.base.spd, end: ent.base.end };
  const add = { hp: ent.base.hp || 0, crit: 0, evade: 0, combo: 0, block: 0, lifesteal: 0, thorns: 0, regen: 0, xp: 0 };
  const items = [equip.weapon, equip.armor, equip.tal1, equip.tal2].filter(Boolean);
  for (const it of items) for (const k in it.affixes) {
    if (k in s) s[k] += it.affixes[k]; else add[k] += it.affixes[k];
  }
  const wk = equip.weapon ? equip.weapon.base : 'poings';
  const W = WEAPONS[wk];
  const wDmg = equip.weapon ? equip.weapon.dmg : W.dmg;
  const A = equip.armor ? ARMORS[equip.armor.base] : null;
  const has = id => ent.skills.includes(id);
  const bossMul = ent.boss ? 1.25 : 1;

  const st = {
    ...s,
    weapon: wk,
    maxHp: Math.round((40 + s.end * 9 + (ent.level - 1) * 3 + add.hp) * bossMul),
    dmg: wDmg + s.str * 1.15,
    armor: equip.armor ? equip.armor.armor : 0,
    evade: clamp(.03 + s.agi * .011 + (W.evade || 0) + (A && A.evade || 0) + add.evade + (has('fantome') ? .08 : 0), 0, .55),
    acc: s.agi * .004,
    crit: clamp(.04 + s.agi * .005 + W.crit + add.crit, 0, .7),
    critMult: has('colere') ? 2.2 : 1.6,
    combo: clamp(s.agi * .007 + W.combo + add.combo, 0, .6),
    block: clamp(add.block + (has('peau') ? .12 : 0), 0, .5),
    lifesteal: add.lifesteal + (has('soif') ? .2 : 0),
    thorns: add.thorns,
    regen: add.regen,
    xpBonus: add.xp,
    speed: Math.max(4, 10 + s.spd + W.spd + (A && A.spd || 0)),
    stun: W.stun || 0,
    pierce: W.pierce || 0,
    first: !!W.first,
    skills: ent.skills.slice(),
  };
  st.dmg *= bossMul;
  st.power = computePower(st);
  return st;
}

/* Puissance = moyenne géométrique attaque x défense. Sert de repère, pas de loi. */
function computePower(st) {
  const has = id => st.skills.includes(id);
  let off = st.dmg * (1 + st.crit * (st.critMult - 1)) * (1 + st.combo) * (st.speed / 10) * (1 + st.lifesteal * .5);
  let def = st.maxHp / (1 - st.armor / (st.armor + 50)) / (1 - st.evade) / (1 - st.block) + st.regen * 25;
  if (has('furie')) off *= 1.12;
  if (has('fracas')) off *= 1.22;
  if (has('riposte')) off *= 1.08;
  if (has('premier')) off *= 1.04;
  if (has('souffle')) def *= 1.2;
  if (has('regard')) def *= 1.12;
  def *= 1 + st.thorns * .4;
  return Math.round(Math.sqrt(off * def) * 10);
}

/* ---------- Familiers ---------- */
const petBase = pet => PETS[pet.species];
function petStats(pet) {
  const sp = petBase(pet), R = RARITIES[pet.rarity];
  const sc = (1 + (pet.ilvl - 1) * .11) * R.mult * (pet.bossPet ? 1.2 : 1);
  const st = {
    maxHp: Math.round(sp.hp * sc), dmg: sp.dmg * sc, armor: 0, evade: sp.evade + (pet.bossPet ? .04 : 0), acc: 0,
    crit: sp.crit, critMult: 1.6, combo: 0, block: 0, lifesteal: 0, thorns: 0, regen: 0,
    speed: sp.speed + Math.min(8, pet.ilvl * .05), stun: 0, pierce: 0, first: false, skills: [],
  };
  st.power = computePower(st);
  return st;
}
const petSlots = level => PET_SLOT_LEVELS.filter(l => level >= l).length;
function teamPower(st, pets) { return Math.round(st.power + (pets || []).filter(Boolean).reduce((a, p) => a + petStats(p).power * .7, 0)); }

/* ---------- XP et niveaux ---------- */
const xpToNext = lvl => Math.round(26 * Math.pow(lvl, 1.62) + 20);
const xpReward = floor => Math.round((10 + floor * 5) * (floor % 10 === 0 ? 3 : 1));
const WIN_HEAL = .2; // part des PV max récupérée après chaque victoire
/* Verse l'XP : chaque niveau = POINTS_PER_LEVEL points, tous les CHOICE_EVERY niveaux = un choix façon MyBrute */
function grantXp(hero, amount) {
  hero.xp += amount; let gained = 0;
  while (hero.xp >= xpToNext(hero.level)) {
    hero.xp -= xpToNext(hero.level); hero.level++; gained++;
    hero.points += POINTS_PER_LEVEL;
    if (hero.level % CHOICE_EVERY === 0) hero.choices++;
    if (hero.level % TP_EVERY === 0) hero.tp = (hero.tp || 0) + 1;
  }
  return gained;
}

/* Choix façon MyBrute : 2 bonus, on en garde 1 */
function rollChoice(hero, freePetSlot, r) {
  const opts = [];
  const free = r.shuffle(SKILL_IDS.filter(id => !hero.skills.includes(id)));
  if (free.length) opts.push({ type: 'skill', id: free[0] });
  if (freePetSlot) opts.push({ type: 'pet', species: r.weighted(PET_POOL.slice(0, 6)), rarity: r.chance(.3) ? 1 : 0 });
  if (free.length > 1 && opts.length < 2) opts.push({ type: 'skill', id: free[1] });
  if (opts.length < 2) opts.push({ type: 'hp', v: 15 + hero.level * 3 });
  if (opts.length < 2) opts.push({ type: 'points', v: 2 });
  return r.shuffle(opts).slice(0, 2);
}
function choiceLabel(c) {
  if (c.type === 'skill') return { title: SKILLS[c.id].name, sub: 'Pouvoir', desc: SKILLS[c.id].desc };
  if (c.type === 'pet') return { title: PETS[c.species].name, sub: 'Familier' + (c.rarity ? ' rare' : ''), desc: 'Combat à tes côtés. Les ennemis partagent leurs coups entre vous.' };
  if (c.type === 'hp') return { title: '+' + c.v + ' PV max', sub: 'Vigueur', desc: 'Plus de marge pour grimper loin.' };
  return { title: '+' + c.v + ' points', sub: 'Entraînement', desc: 'Points de stats bonus à répartir.' };
}

/* Techniques actives : 1 point = débloquer (rang 1) ou améliorer (jusqu'au rang 3) */
const activeRank = (hero, id) => (hero.actives && hero.actives[id]) || 0;
function learnActive(hero, id) {
  if (!hero.actives) hero.actives = {};
  if ((hero.tp || 0) < 1 || activeRank(hero, id) >= 3) return false;
  hero.tp--; hero.actives[id] = activeRank(hero, id) + 1; return true;
}
function ensureHeroV3(hero) {
  if (hero.actives == null) hero.actives = {};
  if (hero.tp == null) hero.tp = 1 + Math.floor(hero.level / TP_EVERY);
}

function enemyTraits(en, heroSt) {
  const es = computeStats(en, en.equip), t = [];
  if (es.evade >= .2) t.push('insaisissable');
  if (es.armor / (es.armor + 50) >= .16) t.push('cuirasse');
  if (es.crit >= .16 || es.skills.includes('fracas') || es.skills.includes('colere')) t.push('frappe');
  if (en.pets && en.pets.length) t.push('meute');
  if (es.regen > 0 || es.skills.includes('souffle') || es.lifesteal >= .1) t.push('increvable');
  if (heroSt && es.speed > heroSt.speed * 1.25) t.push('rapide');
  return t;
}
/* Techniques conseillées : les plus utiles contre les traits de l'adversaire, parmi celles apprises */
function recommendLoadout(hero, traits) {
  const learned = ACTIVE_IDS.filter(id => activeRank(hero, id) > 0);
  const score = id => ACTIVES[id].base + activeRank(hero, id) * .3 + (ACTIVES[id].counters.some(c => traits.includes(c)) ? 3 : 0);
  return learned.sort((a, b) => score(b) - score(a)).slice(0, activeSlots(hero.level));
}

/* ---- 30-loot.js ---- */
/* ===== BUTIN : génération d'objets ===== */
function rollRarity(r, floor, boss) {
  const f = Math.min(floor, 100);
  const w = [Math.max(12, 64 - f * .7), 27 + f * .12, 7 + f * .28, 1.2 + f * .1];
  if (boss) { w[0] = 0; w[2] *= 2; w[3] *= 2.5; }
  return r.weighted(w.map((x, i) => [i, x]));
}

function makeItem(r, slot, ilvl, rarity) {
  const R = RARITIES[rarity];
  const scale = 1 + (ilvl - 1) * .11;
  const it = { id: uid(), slot, ilvl, rarity, affixes: {}, isNew: true };
  if (slot === 'weapon') { it.base = r.pick(WEAPON_DROP); it.dmg = round1(WEAPONS[it.base].dmg * scale * R.mult); }
  else if (slot === 'armor') { it.base = r.pick(Object.keys(ARMORS)); it.armor = Math.round(ARMORS[it.base].armor * scale * R.mult); }
  else it.base = r.pick(Object.keys(TALISMANS));
  const n = R.affixes + (slot === 'talisman' ? 1 : 0);
  const pool = r.shuffle(AFFIX_POOL[slot]);
  for (let i = 0; i < n; i++) { const k = pool[i]; it.affixes[k] = AFFIXES[k].roll(ilvl, R.mult, r); }
  it.name = itemName(r, it);
  return it;
}

function itemName(r, it) {
  const baseName = it.slot === 'weapon' ? WEAPONS[it.base].name : it.slot === 'armor' ? 'Armure ' + ARMORS[it.base].name.toLowerCase() : TALISMANS[it.base].name;
  if (it.rarity === 3) return r.pick(LEGEND_NAMES);
  const mat = MATERIALS[Math.min(MATERIALS.length - 1, Math.floor((it.ilvl - 1) / 10))];
  return baseName + ' ' + mat;
}
function itemTypeName(it) {
  if (it.slot === 'pet') return 'Familier · ' + PETS[it.species].name;
  if (it.slot === 'weapon') return WEAPONS[it.base].name;
  if (it.slot === 'armor') return 'Armure ' + ARMORS[it.base].name.toLowerCase();
  return TALISMANS[it.base].name;
}

function makePet(r, ilvl, rarity, species, bossIdx) {
  const p = { id: uid(), slot: 'pet', ilvl, rarity, species, affixes: {}, isNew: true };
  if (bossIdx != null) { const B = BOSS_PETS[bossIdx]; p.species = B.base; p.bossPet = B.id; p.name = B.name; p.rarity = 3; }
  else p.name = PETS[species].name + (rarity ? ' ' + ['', 'vif', 'farouche', 'alpha'][rarity] : '');
  return p;
}
const bossPetDef = p => p.bossPet ? BOSS_PETS.find(b => b.id === p.bossPet) : null;

function lootForFloor(r, floor, boss, luck) {
  const out = [];
  const tier = Math.min(TIERS.length - 1, Math.floor((floor - 1) / 10));
  if (boss && r.chance(BOSS_PET_CHANCE)) out.push(makePet(r, floor, 3, null, tier));
  if (r.chance(boss ? .15 : .05)) out.push(makePet(r, floor, Math.min(2, rollRarity(r, floor, boss)), r.weighted(PET_POOL)));
  const pick = () => r.weighted([['weapon', 4], ['armor', 3.5], ['talisman', 2.5]]);
  if (boss) {
    out.push(makeItem(r, pick(), floor, rollRarity(r, floor, true)));
    if (r.chance(.35)) out.push(makeItem(r, pick(), floor, rollRarity(r, floor, false)));
  } else if (r.chance(.42 + (luck || 0))) {
    out.push(makeItem(r, pick(), floor, rollRarity(r, floor, false)));
  }
  return out;
}

const salvageValue = it => Math.round((4 + it.ilvl * 1.8) * (1 + it.rarity * 1.3));

function affixText(k, v) {
  const A = AFFIXES[k];
  if (A.pct) return '+' + pct(v) + ' ' + A.label;
  return '+' + v + (A.suffix ? A.suffix : ' ' + A.label);
}

function starterWeapon(origin) {
  const it = makeItem(makeRng(hashStr(origin)), 'weapon', 1, 0);
  it.base = ORIGINS[origin].weapon; it.dmg = WEAPONS[it.base].dmg; it.name = WEAPONS[it.base].name + (it.base === 'marteau' ? ' usé' : ' usée');
  it.isNew = false;
  return it;
}

/* ---- 40-enemy.js ---- */
/* ===== ENNEMIS : un adversaire FIXE par étage (même seed monde = même gardien) ===== */
/* Courbe de difficulté : puissance cible par étage. Seul réglage à toucher pour l'équilibrage. */
const DIFF = { p0: 300, lin: .07, exp: 1.022 };
const targetPower = f => DIFF.p0 * Math.pow(1 + DIFF.lin * (f - 1), 2) * Math.pow(DIFF.exp, f - 1) * (1 - .2 * Math.max(0, 6 - f) / 5);

function makeEnemy(floor, worldSeed) {
  const r = makeRng(hashStr('etage:' + floor + ':' + worldSeed));
  const boss = floor % 10 === 0;
  const origin = r.pick(Object.keys(ORIGINS));
  const O = ORIGINS[origin];
  const base = { str: 2, agi: 2, spd: 2, end: 2, hp: 0 };
  for (const k of STAT_KEYS) base[k] += O.stats[k];
  const wl = STAT_KEYS.map(k => [k, O.weights[k]]);

  const nSk = Math.min(SKILL_IDS.length, (floor < 3 ? 0 : floor < 10 ? 1 : floor < 25 ? 2 : floor < 45 ? 3 : floor < 70 ? 5 : 7) + (boss ? 1 : 0));
  const skills = r.shuffle(SKILL_IDS).slice(0, nSk);

  const equip = {};
  const rar = () => Math.min(rollRarity(r, floor, false), floor < 8 ? 0 : floor < 15 ? 1 : 3);
  if (floor > 6 || r.chance(.14 * floor)) equip.weapon = makeItem(r, 'weapon', floor, boss ? 2 : rar());
  if (floor >= 3 && r.chance(Math.min(.9, .4 + floor * .02)) || boss) equip.armor = makeItem(r, 'armor', floor, boss ? 2 : rar());
  if (floor >= 8) equip.tal1 = makeItem(r, 'talisman', floor, rar());
  if (floor >= 22) equip.tal2 = makeItem(r, 'talisman', floor, rar());
  for (const k in equip) equip[k].isNew = false;
  const pets = [];
  let nPets = floor < 12 ? 0 : floor < 30 ? (r.chance(.4) ? 1 : 0) : floor < 60 ? 1 + (r.chance(.4) ? 1 : 0) : 2 + (r.chance(.3) ? 1 : 0);
  if (boss && floor >= 20) nPets = Math.min(3, nPets + 1);
  for (let i = 0; i < nPets; i++) { const pt = makePet(r, floor, Math.min(2, rar()), r.weighted(PET_POOL)); pt.isNew = false; pets.push(pt); }

  /* Ajuste les stats pour coller à la courbe (le boss garde son bonus x1.25 en plus) */
  const ent = { base, level: floor, skills, boss: false };
  const target = targetPower(floor);
  for (let guard = 0; guard < 400; guard++) {
    const p = teamPower(computeStats(ent, equip), pets);
    if (Math.abs(p - target) / target < .025) break;
    const tot = STAT_KEYS.reduce((a, k) => a + base[k], 0);
    const step = Math.max(1, Math.round(tot * Math.min(.08, Math.abs(p - target) / target / 3)));
    for (let i = 0; i < step; i++) {
      if (p < target) base[r.weighted(wl)]++;
      else { const k = r.weighted(wl); if (base[k] > 1) base[k]--; }
    }
  }

  const look = {
    skin: r.pick(LOOK.skin), hair: r.pick(LOOK.hairStyles), hairColor: r.pick(LOOK.hairColors), eyes: r.pick(LOOK.eyes),
    outfit: r.pick(LOOK.outfit), build: boss ? 'massif' : r.pick(LOOK.builds),
  };
  const tier = Math.min(TIERS.length - 1, Math.floor((floor - 1) / 10));
  const name = boss ? r.pick(NAME_A) + r.pick(NAME_B) : r.pick(NAME_A) + r.pick(NAME_B);
  const title = boss ? BOSS_TITLES[tier] : r.pick(TITLES);
  return { name, title, floor, level: floor, origin, base, skills, equip, pets, look, boss };
}

/* ---- 50-combat.js ---- */
/* ===== COMBAT : moteur pas à pas (déterministe), jouable en direct ou en automatique =====
   next() prépare le prochain coup (pré-tiré, donc le hasard ne dépend pas des actions du joueur),
   resolve(input) l'applique avec les actions du joueur : coup parfait, parade, techniques. */
function makeUnit(id, side, st, hp, name, main) {
  return { id, side, st, main, name, hp: hp == null ? st.maxHp : Math.min(hp, st.maxHp), t: 0, hits: 0, usedSouffle: false, firstDone: false,
    rage: 0, shield: 0, shieldVal: 0, stunTurns: 0, devastate: 0, weak: false, pierceN: 0 };
}

function createFight(heroEnt, heroEquip, heroPets, heroHp, enemy, seed) {
  const r = makeRng(seed);
  const units = [makeUnit('L', 'L', computeStats(heroEnt, heroEquip), heroHp, heroEnt.name, true)];
  (heroPets || []).filter(Boolean).forEach((p, i) => units.push(makeUnit('L' + (i + 1), 'L', petStats(p), null, p.name, false)));
  units.push(makeUnit('R', 'R', computeStats(enemy, enemy.equip), null, enemy.name, true));
  (enemy.pets || []).forEach((p, i) => units.push(makeUnit('R' + (i + 1), 'R', petStats(p), null, p.name, false)));
  const U = {}; for (const u of units) U[u.id] = u;
  U.L.rage = 20;
  const acts = {}; const lo = heroEnt.loadout || recommendLoadout(heroEnt, []);
  for (const id of lo) if (heroEnt.actives && heroEnt.actives[id]) acts[id] = heroEnt.actives[id];
  const F = { units, U, over: false, winner: null, turns: 0, cur: null, pending: null, actives: acts, startHp: U.L.hp };
  const alive = u => u.hp > 0;
  const snap = () => { const o = {}; for (const u of units) o[u.id] = Math.max(0, Math.round(u.hp)); return o; };
  F.snap = snap;
  F.rage = () => Math.round(U.L.rage);
  for (const u of units) { u.t = (100 / u.st.speed) * r.range(.5, 1); if (u.st.first) u.t *= .25; }

  const pickTarget = atk => {
    const foes = units.filter(u => u.side !== atk.side && alive(u));
    const main = foes.find(u => u.main), pets = foes.filter(u => !u.main);
    const roll = r(), pick = r();
    if (!pets.length || roll < (atk.main ? .6 : .7)) return main;
    return pets[Math.floor(pick * pets.length)];
  };
  const finish = () => {
    if (F.over) return;
    F.over = true; F.cur = null; F.pending = null;
    F.winner = !alive(U.L) ? 'R' : !alive(U.R) ? 'L' : (U.L.hp / U.L.st.maxHp >= U.R.hp / U.R.st.maxHp ? 'L' : 'R');
  };
  const checkOver = () => { if (!alive(U.L) || !alive(U.R) || F.turns >= 400) finish(); return F.over; };

  /* Prépare le coup suivant (ou commence un nouveau tour) */
  F.next = () => {
    if (F.over) return null;
    const events = [];
    if (!F.cur) {
      if (checkOver()) return null;
      F.turns++;
      let atk = null; for (const u of units) if (alive(u) && (!atk || u.t < atk.t)) atk = u;
      atk.t += 100 / atk.st.speed;
      if (atk.stunTurns > 0) { atk.stunTurns--; events.push({ type: 'stunned', who: atk.id, hp: snap() }); return { events, strike: null }; }
      if (atk.st.regen && atk.hp < atk.st.maxHp) { const h = Math.min(atk.st.regen, atk.st.maxHp - atk.hp); atk.hp += h; events.push({ type: 'regen', who: atk.id, heal: h, hp: snap() }); }
      F.cur = { atk, def: pickTarget(atk), n: 0, counter: false };
    }
    const { atk, def, counter } = F.cur;
    const p = { atk, def, counter, rEv: r(), rBl: r(), rDmg: r.range(.7, 1.3), rCrit: r(), rStun: r(), rCounter: r(), rCombo: r() };
    p.dodge = p.rEv < clamp(def.st.evade - atk.st.acc, .02, .6);
    p.block = !p.dodge && p.rBl < def.st.block;
    p.crit = p.rCrit < atk.st.crit || (!atk.firstDone && atk.st.skills.includes('premier'));
    p.heavy = atk.st.skills.includes('fracas') && (atk.hits + 1) % 3 === 0;
    p.dangerous = def.id === 'L' && !p.dodge && !p.block && (p.crit || p.heavy);
    F.pending = p;
    return { events, strike: { a: atk.id, d: def.id, counter, telegraph: p.dangerous, heroStrike: atk.id === 'L' } };
  };

  /* Applique le coup préparé. input = { perfect, parry } */
  F.resolve = input => {
    input = input || {};
    const p = F.pending; if (!p) return { events: [], cont: null };
    F.pending = null;
    const { atk, def, counter } = p;
    const events = [];
    atk.hits++; atk.firstDone = true;
    const base = { type: 'atk', a: atk.id, d: def.id, counter };
    let miss = false;
    const devast = atk.devastate;
    if (!devast && p.dodge) { events.push({ ...base, res: 'dodge' }); miss = true; }
    else if (!devast && p.block) { events.push({ ...base, res: 'block' }); miss = true; }
    else {
      let d = atk.st.dmg * p.rDmg;
      const e = { ...base, res: 'hit', crit: p.crit, heavy: p.heavy };
      if (p.crit) d *= atk.st.critMult;
      if (p.heavy) d *= 2;
      if (atk.st.skills.includes('furie') && atk.hp / atk.st.maxHp < .4) d *= 1.4;
      if (def.st.skills.includes('regard')) d *= .88;
      if (atk.weak) d *= .9;
      if (devast) { d *= devast; e.devast = true; atk.devastate = 0; }
      if (atk.id === 'L' && input.perfect) { d *= PERFECT_MULT; e.perfect = true; }
      if (def.id === 'L' && input.parry && p.dangerous) { d *= PARRY_MULT; e.parried = true; }
      if (def.shield > 0) { d *= 1 - def.shieldVal; def.shield--; e.shielded = true; }
      let arm = def.st.armor * (1 - atk.st.pierce);
      if (atk.pierceN > 0) { arm = 0; atk.pierceN--; e.pierce = true; }
      d *= 1 - arm / (arm + 50);
      d = Math.max(1, Math.round(d));
      def.hp -= d; e.dmg = d;
      if (atk.st.stun && def.hp > 0 && p.rStun < atk.st.stun) { def.t += 70 / def.st.speed; e.stun = true; }
      if (atk.st.lifesteal) { const h = Math.round(d * atk.st.lifesteal); if (h > 0) { atk.hp = Math.min(atk.st.maxHp, atk.hp + h); e.heal = h; } }
      if (def.st.thorns && def.hp > 0) { const t = Math.max(1, Math.round(d * def.st.thorns)); atk.hp -= t; e.thorns = t; }
      if (def.id === 'L') U.L.rage = Math.min(RAGE.max, U.L.rage + RAGE.onHit);
      e.hp = snap(); events.push(e);
      if (def.hp <= 0 && !def.main && !def._downSent) { def._downSent = true; events.push({ type: 'down', id: def.id, hp: snap() }); }
      if (atk.hp <= 0 && !atk.main && !atk._downSent) { atk._downSent = true; events.push({ type: 'down', id: atk.id, hp: snap() }); }
      if (def.hp > 0 && !def.usedSouffle && def.st.skills.includes('souffle') && def.hp / def.st.maxHp < .3) {
        def.usedSouffle = true; const h = Math.round(def.st.maxHp * .35); def.hp = Math.min(def.st.maxHp, def.hp + h);
        events.push({ type: 'skill', who: def.id, id: 'souffle', heal: h, hp: snap() });
      }
    }
    if (miss) events[events.length - 1].hp = snap();
    if (atk.id === 'L') U.L.rage = Math.min(RAGE.max, U.L.rage + RAGE.onStrike);
    let cont = null;
    if (checkOver()) cont = null;
    else if (!alive(def) || !alive(atk)) F.cur = null;
    else if (miss) {
      if (!counter && def.st.skills.includes('riposte') && p.rCounter < .35) { F.cur = { atk: def, def: atk, n: 0, counter: true }; cont = 'counter'; }
      else F.cur = null;
    } else if (!counter) {
      F.cur.n++;
      if (F.cur.n < 4 && p.rCombo < atk.st.combo) cont = 'combo'; else F.cur = null;
    } else F.cur = null;
    return { events, cont };
  };

  /* Technique active du héros */
  F.canUse = id => !F.over && F.actives[id] && U.L.rage >= ACTIVES[id].cost && alive(U.L);
  F.useActive = id => {
    if (!F.canUse(id)) return null;
    const A = ACTIVES[id], rank = F.actives[id], v = A.val[rank - 1];
    U.L.rage -= A.cost;
    const e = { type: 'active', who: 'L', id };
    if (id === 'devaste') U.L.devastate = v;
    else if (id === 'bouclier') { U.L.shield = 2; U.L.shieldVal = v; }
    else if (id === 'soin') { const h = Math.min(U.L.st.maxHp - U.L.hp, Math.round(U.L.st.maxHp * v)); U.L.hp += h; e.heal = h; }
    else if (id === 'cri') { U.R.stunTurns += v; if (rank >= 2) U.R.weak = true; }
    else if (id === 'brise') U.L.pierceN = v;
    else if (id === 'balayage') {
      e.hits = [];
      for (const u of units) if (u.side === 'R' && alive(u)) {
        const dd = Math.max(1, Math.round(U.L.st.dmg * v * (u.main ? .5 : 1)));
        u.hp -= dd; e.hits.push({ id: u.id, dmg: dd });

    const out = [e];
    for (const u of units) if (u.side === 'R' && !u.main && u.hp <= 0 && !u._downSent) { u._downSent = true; out.push({ type: 'down', id: u.id, hp: snap() }); }

    return out;
  };
  /* Joueur automatique : utilise ses techniques dès que possible, sans chercher le bon moment */
  F.autoActives = () => {
    const out = [];
    for (const id of ACTIVE_IDS) {
      if (!F.canUse(id)) continue;
      if (id === 'soin' && U.L.hp / U.L.st.maxHp > .5) continue;
      if (id === 'devaste' && U.L.devastate) continue;
      if (id === 'bouclier' && U.L.shield) continue;
      if (id === 'brise' && U.L.pierceN) continue;
      if (id === 'balayage' && !units.some(u => u.side === 'R' && !u.main && alive(u))) continue;
      out.push(...F.useActive(id));
    }
    return out;
  };
  F.info = () => { const o = {}; for (const u of units) o[u.id] = { max: u.st.maxHp, name: u.name, main: u.main }; o.L.start = F.startHp; return o; };
  F.result = events => ({ events, winner: F.winner, heroHp: Math.max(0, Math.round(U.L.hp)), units: F.info() });

  F.runAuto = () => {
    const evs = [];
    if (F.pending) evs.push(...F.resolve({}).events);
    let guard = 0;
    while (!F.over && guard++ < 5000) {
      evs.push(...F.autoActives());
      const n = F.next(); if (!n) break;
      evs.push(...n.events);
      if (n.strike) evs.push(...F.resolve({}).events);
    }
    finish();
    return evs;
  };
  return F;
}

/* Combat entièrement automatique (estimation, bot d'équilibrage, combat interrompu) */
function simulateFight(heroEnt, heroEquip, heroPets, heroHp, enemy, seed, opts) {
  const F = createFight(heroEnt, heroEquip, heroPets, heroHp, enemy, seed);
  const events = F.runAuto();
  if (!(opts && opts.noEvents)) events.push({ type: 'end', winner: F.winner, hp: F.snap() });
  return F.result(opts && opts.noEvents ? [] : events);
}

/* Estimation Monte-Carlo (jeu automatique) : affichée au joueur pour décider « je pousse ou j'encaisse ». */
function winChance(heroEnt, heroEquip, heroPets, heroHp, enemy, n) {
  n = n || 80; let w = 0;
  for (let i = 0; i < n; i++) if (simulateFight(heroEnt, heroEquip, heroPets, heroHp, enemy, 7919 * i + 13, { noEvents: true }).winner === 'L') w++;
  return w / n;
}

/* ===== UI : helpers DOM + composants réutilisables ===== */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

  return h('button', { class: 'tile', style: { '--rbg': rarityBg(it.rarity), borderColor: it.rarity ? RARITIES[it.rarity].color : null }, onclick: o.onclick, 'aria-label': it.name },
    (() => { const ic = icon(itemIcon(it), o.size || 34); if (it.slot === 'pet') ic.style.color = (bossPetDef(it) || PETS[it.species]).col; return ic; })(),
    h('span', { class: 'lv num' }, it.ilvl),
    o.delta != null ? h('span', { class: 'dl num ' + (o.delta > 0 ? 'pos' : 'neg') }, o.delta > 0 ? '▲' + fmt(o.delta) : o.delta < 0 ? '▼' : '=') : o.up ? h('span', { class: 'up' }, '▲') : null,

function itemMainStat(it) {
  if (it.slot === 'weapon') return { k: 'Dégâts', v: it.dmg.toString().replace('.', ',') };
  if (it.slot === 'armor') return { k: 'Armure', v: it.armor };
  if (it.slot === 'pet') { const p = petStats(it); return { k: 'PV ' + p.maxHp + ' · Dégâts', v: Math.round(p.dmg) }; }
  return null;
}

function overlay(content, o) {
  o = o || {};
  const ov = h('div', { class: 'ov' + (o.center ? ' center' : '') });
  const close = () => { ov.remove(); o.onclose && o.onclose(); };
  ov.addEventListener('click', e => { if (e.target === ov && o.dismiss !== false) close(); });
  const sheet = h('div', { class: 'sheet' }, typeof content === 'function' ? content(close) : content);
  ov.append(sheet);
  document.getElementById('app').append(ov);
  return { el: ov, sheet, close };
}

function toast(msg) {
  const t = h('div', { class: 'toast' }, msg);

  setTimeout(() => t.remove(), 2300);

/* ===== MAIN : état, sauvegarde, écrans ===== */
const SAVE_KEY = 'fighters.save.v2';
const INV_MAX = 60;
let S = null, tab = 'tour', alloc = null, heroSub = 'stats';
let _enemies = {};

function save() {
  if (S) S.savedAt = Date.now();
  try { if (S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* stockage navigateur indisponible */ }
  cloudPush();
}

/* ---------- Sauvegarde cloud (capacité db de la page publiée) ----------
   Une partie par personne, privée : data/users/<id>/save. Le navigateur sert de cache et de secours. */
const Cloud = { ref: null, status: 'local', busy: false, dirty: false, timer: null };
async function cloudInit() {
  const C = window.claude;
  if (!C || !C.use) return;
  try {
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/save');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 10000))]);
    Cloud.ref = ref; Cloud.status = 'cloud';
    const d = snap.exists ? snap.data() : null;
    if (d && typeof d.json === 'string') {
      const remote = JSON.parse(d.json);
      if (remote && remote.v === 2 && (!S || (remote.savedAt || 0) > (S.savedAt || 0))) {
        S = remote; _enemies = {}; try { localStorage.setItem(SAVE_KEY, d.json); } catch (e) { }
        if (S.pendingFight) resolvePendingFight();
        if (!document.querySelector('.fight')) render();
        toast('Partie restaurée');
        return;
      }
    }
    if (S) cloudPush();
  } catch (e) { Cloud.ref = null; Cloud.status = 'local'; }
}
function cloudPush() {
  if (!Cloud.ref) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(cloudWrite, 700);
}
async function cloudWrite() {
  if (!Cloud.ref) return;
  if (Cloud.busy) { Cloud.dirty = true; return; }
  Cloud.busy = true; Cloud.dirty = false;
  try {
    if (S) await Cloud.ref.set({ json: JSON.stringify(S), savedAt: S.savedAt || Date.now() });
    else await Cloud.ref.delete();
    Cloud.status = 'cloud';
  } catch (e) {
    const c = e && e.code;
    if (c === 'unavailable') Cloud.dirty = true;
    else { Cloud.ref = null; Cloud.status = 'local'; }
  }
  Cloud.busy = false;
  if (Cloud.dirty) { Cloud.dirty = false; setTimeout(cloudWrite, 1500); }
}
function load() { try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
const heroStats = () => computeStats(S.hero, S.equip);
const myPets = () => S.pets.slice(0, petSlots(S.hero.level)).filter(Boolean);
function enemyAt(f) { const k = f + ':' + S.world; return _enemies[k] || (_enemies[k] = makeEnemy(f, S.world)); }
const randomName = () => { const r = makeRng((Math.random() * 1e9) | 0); return r.pick(NAME_A) + r.pick(NAME_B); };
const rnd = () => makeRng((Math.random() * 2 ** 31) | 0);

/* Codex : tout ce que le héros a déjà possédé (armes, familiers). Pouvoirs = hero.skills. */

const junk = () => S.inv.filter(it => deltaFor(it) <= 0 && it.rarity < 3 && !it.bossPet && (it.slot !== 'pet' || petSlots(S.hero.level) > 0) &&

/* Tout optimiser en 1 tap : équipe le meilleur, puis démantèle l'inutile. Renvoie {eq, sold, xp, lv} */

    section('Nom', h('div', { class: 'row' }, nameIn, h('button', { class: 'btn btn-sm btn-stone', 'aria-label': 'Nom au hasard', onclick: () => { nameIn.value = st.name = randomName(); } }, icon('dice', 22)))),
    section('Origine', origins),
    section('Peau', swatches('skin', LOOK.skin)),
    section('Coiffure', pills('hair', LOOK.hairStyles, LOOK.hairStyleNames)),
    section('Cheveux', swatches('hairColor', LOOK.hairColors)),
    section('Yeux', swatches('eyes', LOOK.eyes)),
    section('Tenue', swatches('outfit', LOOK.outfit)),
    section('Carrure', pills('build', LOOK.builds, LOOK.buildNames)),
    h('button', { class: 'btn btn-gold btn-big', style: { marginTop: '6px' }, onclick: () => {
      Sfx.init(); Sfx.play('level');
      newGame((st.name || '').trim() || randomName(), { ...st.look }, st.origin); tab = 'tour'; render();
    } }, 'Entrer dans la Tour'));
  app.append(sc);
}

/* ---------- Démarrage ---------- */
function boot(data) {
  S = (data && data.S) || load();
  if (S && S.v !== 2) S = null;
  if (S && !S.speed) S.speed = 2;
  if (S) { ensureCodex(); ensureHeroV3(S.hero); if (S.pendingFight) resolvePendingFight(); }
  if (S) { Sfx.on = S.sound !== false; Music.on = S.music !== false; }
  if (S && S.pendingFight) resolvePendingFight();
  render();
  cloudInit();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ S })); } catch (e) { }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
